<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Love ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #0d071f;
        --screen-bg: #1a0b2e;
        --border-color: #f472b6;
        --text-color: #e2e8f0;
        --hp-color: #ef4444;
        --mp-color: #3b82f6;
        --love-color: #ec4899;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        image-rendering: pixelated; /* Магия для картинок */
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'VT323', monospace;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
    }

    /* ЭКРАН ИГРЫ */
    .game-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 500px;
        height: 90vh;
        max-height: 800px;
        background-color: var(--screen-bg);
        border: 6px solid #fff;
        border-radius: 0;
        box-shadow: 
            0 0 0 6px #000,
            0 0 20px rgba(244, 114, 182, 0.4);
        display: flex;
        flex-direction: column;
        padding: 20px;
    }

    /* ШАПКА (Статус) */
    .status-bar {
        display: flex;
        justify-content: space-between;
        font-family: 'Press Start 2P', cursive;
        font-size: 10px;
        margin-bottom: 20px;
        color: #fff;
    }

    .hp-bar-container {
        width: 100%;
        margin-bottom: 30px;
    }
    
    .bar-label {
        font-family: 'Press Start 2P', cursive;
        font-size: 8px;
        margin-bottom: 5px;
        color: var(--love-color);
    }

    .bar-bg {
        width: 100%;
        height: 16px;
        background-color: #000;
        border: 2px solid #fff;
        padding: 2px;
    }

    .bar-fill {
        height: 100%;
        width: 10%;
        background-color: var(--love-color);
        transition: width 0.3s steps(10); /* Ретро-эффект заполнения */
        box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3);
    }

    /* СЦЕНА (Пиксельные арты) */
    .scene {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        position: relative;
    }

    .pixel-char {
        width: 64px;
        height: 64px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: float 2s infinite steps(2); /* Анимация в 2 кадра */
    }

    .char-boy {
        /* Пиксельный парень (SVG код) */
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="8" height="8" fill="%23fcd34d"/><rect x="3" y="4" width="2" height="6" fill="%233b82f6"/><rect x="11" y="4" width="2" height="6" fill="%233b82f6"/><rect x="5" y="5" width="2" height="2" fill="%23000"/><rect x="9" y="5" width="2" height="2" fill="%23000"/><rect x="6" y="8" width="4" height="2" fill="%23ef4444"/><rect x="5" y="10" width="6" height="6" fill="%231e293b"/><rect x="4" y="12" width="2" height="4" fill="%231e293b"/><rect x="10" y="12" width="2" height="4" fill="%231e293b"/></svg>');
    }

    .char-girl {
        /* Пиксельная девушка (SVG код) */
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="8" height="8" fill="%23fcd34d"/><rect x="3" y="1" width="10" height="4" fill="%23a855f7"/><rect x="3" y="4" width="2" height="8" fill="%23a855f7"/><rect x="11" y="4" width="2" height="8" fill="%23a855f7"/><rect x="5" y="5" width="2" height="2" fill="%23000"/><rect x="9" y="5" width="2" height="2" fill="%23000"/><rect x="6" y="8" width="4" height="1" fill="%23ef4444"/><rect x="5" y="10" width="6" height="6" fill="%23ec4899"/><rect x="4" y="12" width="2" height="4" fill="%23ec4899"/><rect x="10" y="12" width="2" height="4" fill="%23ec4899"/></svg>');
    }

    /* Анимация парения */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    /* Пиксельное сердечко */
    .pixel-heart {
        width: 32px;
        height: 32px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M4 2h8v2h2v4h-2v2h-2v2H8v2H6v-2H4v-2H2V6h2V4h-2z" fill="%23ec4899"/></svg>');
        background-size: contain;
        animation: pulse 1s infinite steps(2);
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
    }

    @keyframes pulse {
        0% { transform: translateX(-50%) scale(1); }
        100% { transform: translateX(-50%) scale(1.2); }
    }

    /* ДИАЛОГОВОЕ ОКНО */
    .dialogue-box {
        background-color: #000;
        border: 4px solid #fff;
        padding: 20px;
        height: 120px;
        margin-bottom: 20px;
        position: relative;
        box-shadow: inset 0 0 0 2px #000; /* Внутренняя тень */
    }

    .dialogue-text {
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 1px;
    }

    .cursor {
        display: inline-block;
        width: 10px;
        height: 18px;
        background-color: #fff;
        animation: blink 1s infinite steps(2);
        vertical-align: bottom;
        margin-left: 4px;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* КНОПКИ ДЕЙСТВИЙ */
    .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .pixel-btn {
        background-color: #000;
        color: #fff;
        border: 3px solid #fff;
        padding: 15px 10px;
        font-family: 'Press Start 2P', cursive;
        font-size: 10px;
        cursor: pointer;
        transition: all 0.1s;
        text-transform: uppercase;
    }

    .pixel-btn:hover {
        background-color: var(--border-color);
        color: #000;
    }

    .pixel-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    /* Кастомный скроллбар */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #fff; border: 3px solid #000; }
</style>
</head>
<body>

<!-- Фон с пиксельным снегом -->
<canvas id="snowCanvas"></canvas>

<div class="game-container">
    <!-- Статус -->
    <div class="status-bar">
        <span>RAUANNA.exe</span>
        <span>LVL 99</span>
    </div>

    <!-- Полоска любви -->
    <div class="hp-bar-container">
        <div class="bar-label">LOVE METER</div>
        <div class="bar-bg">
            <div class="bar-fill" id="loveBar"></div>
        </div>
    </div>

    <!-- Сцена -->
    <div class="scene">
        <div class="pixel-char char-boy"></div>
        <div class="pixel-char char-girl"></div>
        <div class="pixel-heart" id="heartAnimation"></div>
    </div>

    <!-- Диалоговое окно -->
    <div class="dialogue-box">
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="cursor"></div>
    </div>

    <!-- Кнопки -->
    <div class="actions">
        <button class="pixel-btn" onclick="doAction('hug')">[ Обнять ]</button>
        <button class="pixel-btn" onclick="doAction('kiss')">[ Поцеловать ]</button>
        <button class="pixel-btn" onclick="doAction('gift')">[ Подарок ]</button>
        <button class="pixel-btn" onclick="doAction('reset')">[ Сброс ]</button>
    </div>
</div>

<script>
    // --- ПИКСЕЛЬНЫЙ СНЕГ (Canvas) ---
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const snowflakes = [];
    const maxFlakes = 50;

    for (let i = 0; i < maxFlakes; i++) {
        snowflakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 4 + 2, // Пиксельный размер
            speedY: Math.random() * 1.5 + 0.5,
            speedX: Math.random() * 1 - 0.5,
            opacity: Math.random() * 0.5 + 0.3
        });
    }

    function drawSnow() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#fff';

        snowflakes.forEach(f => {
            ctx.globalAlpha = f.opacity;
            // Рисуем квадраты для пиксельного эффекта
            ctx.fillRect(Math.floor(f.x), Math.floor(f.y), f.size, f.size);

            f.y += f.speedY;
            f.x += f.speedX;

            if (f.y > height) {
                f.y = -10;
                f.x = Math.random() * width;
            }
        });

        ctx.globalAlpha = 1;
        requestAnimationFrame(drawSnow);
    }
    drawSnow();


    // --- 8-БИТНЫЙ ЗВУК (Web Audio API) ---
    let audioCtx = null;
    function play8BitSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'square'; // Квадратная волна = 8-бит
        
        if (type === 'click') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'love') {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'reset') {
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
    }


    // --- ЛОГИКА ИГРЫ ---
    const dialogueText = document.getElementById('dialogueText');
    const loveBar = document.getElementById('loveBar');
    const heartAnim = document.getElementById('heartAnimation');
    
    let loveLevel = 10; // Начальный уровень любви
    let isTyping = false;
    let typeTimeout;

    const dialogues = {
        start: "Привет, Рауанна! Я собрал этот пиксельный мир специально для тебя. Нажимай на кнопки внизу!",
        hug: "Ты обняла меня! +20 к любви. Я чувствую тепло даже через экран!",
        kiss: "Чмок! +30 к любви. Моя пиксельная жизнь стала ярче!",
        gift: "Ты открыла подарок! Внутри был билет в наш будущий отпуск. +15 к любви.",
        reset: "Сброс... Но моя любовь к тебе не сбрасывается!",
        max: "Максимальный уровень любви! ❤️ Ты победила в этой игре, потому что ты уже выиграла мое сердце."
    };

    // Функция печати текста (Эффект печатной машинки)
    function typeText(text) {
        clearTimeout(typeTimeout);
        dialogueText.textContent = "";
        let i = 0;
        isTyping = true;

        function type() {
            if (i < text.length) {
                dialogueText.textContent += text.charAt(i);
                i++;
                typeTimeout = setTimeout(type, 30); // Скорость печати
            } else {
                isTyping = false;
            }
        }
        type();
    }

    // Обработка кнопок
    function doAction(action) {
        if (isTyping) {
            // Если текст еще печатается, при клике выводим его мгновенно
            dialogueText.textContent = dialogues[action] || dialogues.start;
            isTyping = false;
            clearTimeout(typeTimeout);
            return;
        }

        if (action === 'hug') {
            play8BitSound('love');
            loveLevel = Math.min(100, loveLevel + 20);
            typeText(dialogues.hug);
            showHeart();
        } 
        else if (action === 'kiss') {
            play8BitSound('love');
            loveLevel = Math.min(100, loveLevel + 30);
            typeText(dialogues.kiss);
            showHeart();
        }
        else if (action === 'gift') {
            play8BitSound('love');
            loveLevel = Math.min(100, loveLevel + 15);
            typeText(dialogues.gift);
            showHeart();
        }
        else if (action === 'reset') {
            play8BitSound('reset');
            loveLevel = 10;
            typeText(dialogues.reset);
        }

        updateBar();

        if (loveLevel >= 100 && action !== 'reset') {
            setTimeout(() => {
                typeText(dialogues.max);
                play8BitSound('love');
            }, 1500);
        }
    }

    function updateBar() {
        loveBar.style.width = loveLevel + '%';
    }

    function showHeart() {
        heartAnim.style.opacity = '1';
        heartAnim.style.top = '30%'; // Подпрыгивает
        setTimeout(() => {
            heartAnim.style.top = '20%'; // Возвращается
            heartAnim.style.opacity = '0';
        }, 800);
    }

    // Инициализация
    window.onload = () => {
        updateBar();
        setTimeout(() => typeText(dialogues.start), 500);
    };

</script>
<script src="prank2.js"></script>
</body>
</html>
