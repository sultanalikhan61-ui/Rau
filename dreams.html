<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наши Мечты ✨</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    .back-btn {
      display: inline-block;
      margin-bottom: 15px;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .dream-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
    }

    .dream-card h2 {
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 15px;
    }

    .columns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .columns-grid {
        grid-template-columns: 1fr;
      }
    }

    .column-box {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      padding: 12px;
    }

    .column-box h4 {
      font-size: 0.88rem;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .dreams-list {
      list-style: none;
      padding: 0;
      margin: 0;
      min-height: 40px;
    }

    .dream-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dream-item button {
      background: none;
      border: none;
      color: #ff4757;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .add-dream-box {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .add-dream-box input {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .add-dream-box button {
      padding: 8px 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="bg-hearts" id="bgHearts"></div>

  <div class="main-wrapper">
    <a href="index.html" class="back-btn" data-tg-notify="Вернулась на главную из Мечты">← На главную</a>

    <header>
      <div class="bunny-avatar" style="font-size: 3rem; display: flex; align-items: center; justify-content: center; background: #fff0f3;">✨</div>
      <h1>Наши Мечты & Планы</h1>
      <p>Совместный список целей и желаний</p>
    </header>

    <!-- 1. ЗИМНИЕ КАНИКУЛЫ -->
    <div class="dream-card">
      <h2>❄️ Зимние каникулы (Возвращение в КЗ)</h2>
      <div class="columns-grid">
        <div class="column-box">
          <h4>Мечты Султана 💙</h4>
          <ul class="dreams-list" id="list-winter-sultan"></ul>
          <div class="add-dream-box">
            <input type="text" id="input-winter-sultan" placeholder="Добавить...">
            <button onclick="addDream('winter', 'sultan')">+</button>
          </div>
        </div>

        <div class="column-box">
          <h4>Мечты Рауанны 💖</h4>
          <ul class="dreams-list" id="list-winter-rauanna"></ul>
          <div class="add-dream-box">
            <input type="text" id="input-winter-rauanna" placeholder="Добавить...">
            <button onclick="addDream('winter', 'rauanna')">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. ПОСЛЕ УЧЕБЫ -->
    <div class="dream-card">
      <h2>🎓 После учебы (Через год)</h2>
      <div class="columns-grid">
        <div class="column-box">
          <h4>Мечты Султана 💙</h4>
          <ul class="dreams-list" id="list-year-sultan"></ul>
          <div class="add-dream-box">
            <input type="text" id="input-year-sultan" placeholder="Добавить...">
            <button onclick="addDream('year', 'sultan')">+</button>
          </div>
        </div>

        <div class="column-box">
          <h4>Мечты Рауанны 💖</h4>
          <ul class="dreams-list" id="list-year-rauanna"></ul>
          <div class="add-dream-box">
            <input type="text" id="input-year-rauanna" placeholder="Добавить...">
            <button onclick="addDream('year', 'rauanna')">+</button>
          </div>
        </div>
      </div>
    </div>

    <footer>Made with ❤️ specially for you</footer>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
      authDomain: "our-tracker-3cbb5.firebaseapp.com",
      databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "our-tracker-3cbb5",
      storageBucket: "our-tracker-3cbb5.firebasestorage.app",
      messagingSenderId: "25579778585",
      appId: "1:25579778585:web:9672e4b718fc5309bdb088",
      measurementId: "G-Y2XCFWYJK0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const savedMode = localStorage.getItem('site_color_mode') || 'light';
    document.documentElement.setAttribute('data-mode', savedMode);

    const part1 = "8818384063:";
    const part2 = "AAEEqTup6sgED-gYB_1tm";
    const part3 = "cQKcXwi-UDE3lQ";
    const BOT_TOKEN = part1 + part2 + part3;
    const CHAT_ID = "606061445";

    function sendTelegramNotification(text) {
      if (localStorage.getItem('is_sultan') === 'true') return;
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`).catch(() => {});
    }

    function listenDreams() {
      db.ref('dreams').on('value', snapshot => {
        const data = snapshot.val() || {};
        renderCategory('winter', data.winter || {});
        renderCategory('year', data.year || {});
      });
    }

    function renderCategory(category, catData) {
      ['sultan', 'rauanna'].forEach(author => {
        const listEl = document.getElementById(`list-${category}-${author}`);
        listEl.innerHTML = '';
        
        const userDreams = catData[author] || {};
        const keys = Object.keys(userDreams);

        if (keys.length === 0) {
          listEl.innerHTML = `<li style="font-size: 0.78rem; color: var(--subtext-color); text-align: center; padding: 8px;">Пока пусто ✨</li>`;
          return;
        }

        keys.forEach(key => {
          const dreamText = userDreams[key];
          const li = document.createElement('li');
          li.className = 'dream-item';
          li.innerHTML = `<span>${dreamText}</span> <button onclick="deleteDream('${category}', '${author}', '${key}')">✕</button>`;
          listEl.appendChild(li);
        });
      });
    }

    function addDream(category, author) {
      const inputEl = document.getElementById(`input-${category}-${author}`);
      const text = inputEl.value.trim();
      if (!text) return;

      db.ref(`dreams/${category}/${author}`).push(text);
      
      const authorName = author === 'sultan' ? 'Султан' : 'Рауанна';
      sendTelegramNotification(`✨ <b>${authorName} добавил(а) мечту:</b> ${text}`);
      
      inputEl.value = '';
    }

    function deleteDream(category, author, key) {
      db.ref(`dreams/${category}/${author}/${key}`).remove();
    }

    window.addEventListener('DOMContentLoaded', () => {
      listenDreams();
      sendTelegramNotification("✨ <b>Рауанна зашла на страницу 'Наши Мечты'!</b>");
    });
  </script>
</body>
</html>
