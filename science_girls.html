<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Девушки в науке 🔬</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --neon: #00f3ff;
    --pink: #ff00a0;
    --green: #00ff66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 50%, #1a1a24 0%, var(--bg) 100%);
    color: #fff; font-family: 'Nunito', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .back { position: absolute; top: 20px; left: 20px; color: var(--neon); text-decoration: none; font-weight: 800; z-index: 10; font-family: 'Share Tech Mono', monospace; }
  
  header { text-align: center; position: absolute; top: 50px; width: 100%; z-index: 10; }
  header h1 { font-family: 'Share Tech Mono', monospace; color: var(--neon); font-size: 1.8rem; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); letter-spacing: 2px;}
  header p { font-size: 0.9rem; color: #888; margin-top: 5px; font-family: 'Share Tech Mono', monospace; }

  /* Лабораторный стол */
  .lab-table {
    display: flex; gap: 20px; margin-top: 50px; z-index: 10;
  }

  .flask-container {
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    transition: transform 0.3s;
  }
  .flask-container:hover { transform: translateY(-10px); }
  
  /* Колба (SVG) */
  .flask {
    width: 80px; height: 120px; position: relative;
  }
  .flask svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px currentColor); }
  
  /* Жидкость */
  .liquid {
    transition: height 0.5s, fill 0.5s;
  }
  
  /* Пузырьки */
  .bubble {
    position: absolute; bottom: 10px; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.8); opacity: 0; pointer-events: none;
  }
  .flask-container.boiling .bubble { animation: rise 1s ease-in infinite; }
  .flask-container.boiling .bubble:nth-child(2) { animation-delay: 0.2s; left: 40%; }
  .flask-container.boiling .bubble:nth-child(3) { animation-delay: 0.4s; left: 60%; }
  .flask-container.boiling .bubble:nth-child(4) { animation-delay: 0.6s; left: 30%; }

  @keyframes rise {
    0% { bottom: 10px; opacity: 1; transform: scale(1); }
    100% { bottom: 90px; opacity: 0; transform: scale(1.5); }
  }

  .flask-label { margin-top: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; color: #aaa; }

  /* Модалка (Результат опыта) */
  .modal {
    position: fixed; inset: 0; background: rgba(9,9,11,0.9); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .modal.on { opacity: 1; pointer-events: auto; }
  
  .modal-card {
    background: #111; border: 1px solid var(--neon); border-radius: 12px;
    padding: 30px 20px; max-width: 350px; width: 90%; text-align: center;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); position: relative;
    font-family: 'Share Tech Mono', monospace;
  }
  .modal-card::before {
    content: 'SYSTEM_OUTPUT'; position: absolute; top: -10px; left: 20px;
    background: #111; padding: 0 10px; color: var(--neon); font-size: 0.7rem;
  }
  .modal-card h2 { color: var(--neon); margin-bottom: 15px; font-size: 1.2rem; }
  .modal-card p { color: #ddd; line-height: 1.6; font-size: 0.95rem; margin-bottom: 20px; }
  .modal-card button {
    background: var(--neon); color: #000; border: none; padding: 10px 20px;
    border-radius: 6px; font-weight: bold; font-family: 'Share Tech Mono', monospace;
    cursor: pointer; width: 100%;
  }
</style>
</head>
<body>

<a href="index.html" class="back">← На главную</a>
<header>
  <h1>Лаборатория №11</h1>
  <p>Девушки в науке: исследуем твой потенциал</p>
</header>

<div class="lab-table">
  <!-- Колба 1 -->
  <div class="flask-container" onclick="boil(this, 'Формула ума', 'Твой мозг — это мощнейший компьютер. Ты с легкостью осваиваешь робототехнику и учишься в магистратуре Британии. Формула: IQ + Упорство = Ты.')">
    <div class="flask">
      <svg viewBox="0 0 100 150">
        <path d="M40,10 L40,60 L10,130 A10,10 0 0,0 20,140 L80,140 A10,10 0 0,0 90,130 L60,60 L60,10 Z" fill="none" stroke="var(--neon)" stroke-width="4"/>
        <rect class="liquid" x="15" y="80" width="70" height="50" fill="var(--neon)" opacity="0.6" rx="5" />
      </svg>
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>
    <div class="flask-label">H₂O (Ум)</div>
  </div>

  <!-- Колба 2 -->
  <div class="flask-container" onclick="boil(this, 'Элемент красоты', 'Даже в лабораторном халате ты выглядишь сногсшибательно. Твоя улыбка — это радиоактивный элемент, который излучает тепло на 5000 км.')">
    <div class="flask">
      <svg viewBox="0 0 100 150">
        <path d="M40,10 L40,60 L10,130 A10,10 0 0,0 20,140 L80,140 A10,10 0 0,0 90,130 L60,60 L60,10 Z" fill="none" stroke="var(--pink)" stroke-width="4"/>
        <rect class="liquid" x="15" y="90" width="70" height="40" fill="var(--pink)" opacity="0.6" rx="5" />
      </svg>
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>
    <div class="flask-label">Au (Красота)</div>
  </div>

  <!-- Колба 3 -->
  <div class="flask-container" onclick="boil(this, 'Реакция любви', 'При смешивании султана и рауанны выделяется огромное количество энергии. Реакция необратима. Побочный эффект: вечное счастье.')">
    <div class="flask">
      <svg viewBox="0 0 100 150">
        <path d="M40,10 L40,60 L10,130 A10,10 0 0,0 20,140 L80,140 A10,10 0 0,0 90,130 L60,60 L60,10 Z" fill="none" stroke="var(--green)" stroke-width="4"/>
        <rect class="liquid" x="15" y="70" width="70" height="60" fill="var(--green)" opacity="0.6" rx="5" />
      </svg>
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>
    <div class="flask-label">Fe (Любовь)</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="mTitle">Название</h2>
    <p id="mText">Текст</p>
    <button onclick="closeModal()">Записать в журнал</button>
  </div>
</div>

<script>
  let currentColor = '';
  function boil(element, title, text) {
    // Визуальный эффект кипения
    element.classList.add('boiling');
    currentColor = element.querySelector('svg').getAttribute('stroke') || element.querySelector('svg').style.stroke;
    
    // Заполняем модалку
    document.getElementById('mTitle').innerText = title;
    document.getElementById('mTitle').style.color = currentColor || '#fff';
    document.getElementById('mText').innerText = text;
    document.getElementById('modal').classList.add('on');
    
    // Останавливаем кипение через 3 секунды
    setTimeout(() => { element.classList.remove('boiling'); }, 3000);
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('on');
  }
</script>
</body>
</html>
