<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin & Draw 🎨</title>
<style>
    :root {
        --bg: #09090b;
        --disk-bg: #ffffff;
        --active-line: #000000;
        --inactive-line: rgba(0, 0, 0, 0.05); /* Еле заметные линии для следующих шагов */
        --ui-text: #a4b0be;
        --btn-bg: #1e1e24;
        --btn-active: #ff4757;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    body {
        background-color: var(--bg);
        color: var(--ui-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding-bottom: 80px; /* Место для кнопок */
    }

    /* === ЗОНА ДЛЯ БУМАГИ === */
    .paper-area {
        position: relative;
        /* Квадрат, который легко накрыть листом А4 или А5 */
        width: 90vw;
        max-width: 420px; 
        aspect-ratio: 1 / 1;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
    }

    /* Метки для фиксации листа (теперь внутри зоны бумаги) */
    .corner-marker {
        position: absolute;
        width: 20px;
        height: 20px;
        border-color: #555;
        border-style: solid;
        pointer-events: none;
        z-index: 10;
    }
    .top-left { top: -10px; left: -10px; border-width: 2px 0 0 2px; }
    .top-right { top: -10px; right: -10px; border-width: 2px 2px 0 0; }
    .bottom-left { bottom: -10px; left: -10px; border-width: 0 0 2px 2px; }
    .bottom-right { bottom: -10px; right: -10px; border-width: 0 2px 2px 0; }

    /* Текст-подсказка */
    .hint-text {
        position: absolute;
        top: -40px;
        left: 0;
        font-size: 11px;
        color: #666;
        text-align: center;
        width: 100%;
        line-height: 1.4;
    }

    /* Указатель шага сверху диска */
    .top-pointer {
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        color: var(--btn-active);
        z-index: 10;
        animation: bounce 2s infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translate(-50%, 0); }
        50% { transform: translate(-50%, -5px); }
    }

    /* === ДИСК === */
    .disk-wrapper {
        width: 90%; /* Чуть меньше рамок, чтобы был отступ */
        height: 90%;
        position: relative;
    }

    #disk {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: transform;
        z-index: 2;
    }

    #drawing {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 3;
        pointer-events: none;
    }

    /* === ЛИНИИ РИСУНКА (Тонкие и аккуратные) === */
    #drawing g {
        stroke: var(--inactive-line);
        stroke-width: 1.5px; /* Тонкие неактивные линии */
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
    }

    /* Активная линия (для просвечивания) */
    #drawing g.active {
        stroke: var(--active-line);
        stroke-width: 3.5px; /* Аккуратная, но видимая */
        filter: drop-shadow(0 0 1px rgba(0,0,0,0.8));
    }

    /* === УПРАВЛЕНИЕ === */
    .controls {
        position: fixed;
        bottom: 20px;
        width: 100%;
        max-width: 420px;
        display: flex;
        gap: 10px;
        padding: 0 15px;
        z-index: 20;
    }

    button {
        background-color: var(--btn-bg);
        color: #fff;
        border: 1px solid #333;
        padding: 15px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        flex: 1;
        outline: none;
    }

    button:active { transform: scale(0.95); background-color: #333; }
    #nextBtn { background-color: var(--btn-active); border-color: var(--btn-active); flex: 2; }
    
    #lockBtn {
        position: fixed;
        top: 20px;
        right: 20px;
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        flex: none;
        z-index: 100;
        width: auto;
    }
    #lockBtn.locked {
        background-color: #ffca3a;
        color: #000;
        border-color: #ffca3a;
    }

</style>
</head>
<body>

    <!-- Кнопка блокировки -->
    <button id="lockBtn">🔓 Касания</button>

    <div class="paper-area">
        <!-- Подсказка -->
        <div class="hint-text">Положи лист бумаги и выровняй по уголкам</div>
        
        <!-- Метки по углам -->
        <div class="corner-marker top-left"></div>
        <div class="corner-marker top-right"></div>
        <div class="corner-marker bottom-left"></div>
        <div class="corner-marker bottom-right"></div>

        <!-- Указатель -->
        <div class="top-pointer">▼</div>

        <!-- Диск -->
        <div class="disk-wrapper">
            <svg id="disk" viewBox="-250 -250 500 500">
                <circle cx="0" cy="0" r="245" fill="var(--disk-bg)" />
                <circle cx="0" cy="0" r="235" fill="none" stroke="#eaeaea" stroke-width="1" />
                <g id="numbersGroup"></g>
            </svg>

            <svg id="drawing" viewBox="-250 -250 500 500">
                <g id="linesGroup"></g>
            </svg>
        </div>
    </div>

    <!-- Кнопки -->
    <div class="controls">
        <button id="prevBtn">← Назад</button>
        <button id="resetBtn">Сброс</button>
        <button id="nextBtn">Далее →</button>
    </div>

<script>
    const totalSteps = 12;
    let currentStep = 0;
    let isLocked = false;

    const disk = document.getElementById('disk');
    const numbersGroup = document.getElementById('numbersGroup');
    const linesGroup = document.getElementById('linesGroup');

    // 12 шагов рисунка
    const drawingPaths = [
        `<circle cx="0" cy="0" r="160" />`,
        `<circle cx="0" cy="0" r="140" />`,
        `<path d="M -60 -40 A 60 60 0 0 1 60 -40" />`,
        `<path d="M 60 -40 A 60 60 0 0 0 -60 -40" />`,
        `<circle cx="-25" cy="-30" r="8" />`,
        `<circle cx="25" cy="-30" r="8" />`,
        `<path d="M -10 -5 L 10 -5 L 0 5 Z" /><path d="M 0 5 Q -15 15 -25 5 M 0 5 Q 15 15 25 5" />`,
        `<path d="M -30 0 L -70 -5 M -30 10 L -70 15" />`,
        `<path d="M 30 0 L 70 -5 M 30 10 L 70 15" />`,
        `<path d="M -50 -60 L -90 -110 L -20 -80 Z" />`,
        `<path d="M 50 -60 L 90 -110 L 20 -80 Z" />`,
        `<path d="M -40 60 Q -80 120 -40 140 M 40 60 Q 80 120 40 140" />`
    ];

    // Генерация номеров
    for (let i = 0; i < totalSteps; i++) {
        const angle = i * 30;
        const rad = (angle - 90) * Math.PI / 180;
        const radius = 200; 
        const x = radius * Math.cos(rad);
        const y = radius * Math.sin(rad);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('font-family', 'sans-serif');
        text.setAttribute('font-weight', '900');
        text.setAttribute('font-size', '28');
        text.setAttribute('fill', '#ccc');
        text.setAttribute('transform', `rotate(${angle}, ${x}, ${y})`);
        text.textContent = i + 1;
        text.id = `num-${i}`;
        numbersGroup.appendChild(text);
    }

    // Генерация линий
    drawingPaths.forEach((path, i) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('id', `line-${i}`);
        g.innerHTML = path;
        linesGroup.appendChild(g);
    });

    // Обновление UI
    function updateUI() {
        const rotationAngle = -(currentStep * 30);
        disk.style.transform = `rotate(${rotationAngle}deg)`;

        for (let i = 0; i < totalSteps; i++) {
            const lineG = document.getElementById(`line-${i}`);
            const numText = document.getElementById(`num-${i}`);

            if (i === currentStep) {
                lineG.classList.add('active');
                numText.setAttribute('fill', 'var(--btn-active)');
                numText.setAttribute('font-size', '34');
            } else {
                lineG.classList.remove('active');
                numText.setAttribute('fill', '#ccc');
                numText.setAttribute('font-size', '28');
            }
        }
    }

    // Кнопки
    document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentStep < totalSteps - 1) {
            currentStep++;
            updateUI();
        } else {
            document.getElementById('nextBtn').innerText = 'Готово! 🎉';
            setTimeout(() => {
                document.getElementById('nextBtn').innerText = 'Далее →';
            }, 2000);
        }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentStep > 0) {
            currentStep--;
            updateUI();
        }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        currentStep = 0;
        updateUI();
    });

    // Блокировка
    document.getElementById('lockBtn').addEventListener('click', (e) => {
        isLocked = !isLocked;
        const btn = e.target;
        
        if (isLocked) {
            btn.innerHTML = '🔒 Блок';
            btn.classList.add('locked');
            disk.style.pointerEvents = 'none';
        } else {
            btn.innerHTML = '🔓 Касания';
            btn.classList.remove('locked');
            disk.style.pointerEvents = 'auto';
        }
    });

    updateUI();
</script>
</body>
</html>
