<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin & Draw 🎨</title>
<style>
    :root {
        --bg: #09090b;
        --disk-bg: #ffffff;
        --active-line: #000000;
        --inactive-line: rgba(0, 0, 0, 0.04);
        --ui-text: #a4b0be;
        --btn-bg: #1e1e24;
        --btn-active: #ff4757;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none; /* Отключает скролл и зум */
    }

    body {
        background-color: var(--bg);
        color: var(--ui-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* 1. Метки для фиксации листа по углам */
    .corner-marker {
        position: fixed;
        width: 35px;
        height: 35px;
        border-color: #444;
        border-style: solid;
        pointer-events: none;
        z-index: 100;
    }
    .top-left { top: 15px; left: 15px; border-width: 3px 0 0 3px; }
    .top-right { top: 15px; right: 15px; border-width: 3px 3px 0 0; }
    .bottom-left { bottom: 15px; left: 15px; border-width: 0 0 3px 3px; }
    .bottom-right { bottom: 15px; right: 15px; border-width: 0 3px 3px 0; }

    /* Указатель для номера шага */
    .top-pointer {
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        color: var(--btn-active);
        z-index: 10;
        animation: bounce 2s infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translate(-50%, 0); }
        50% { transform: translate(-50%, -10px); }
    }

    /* Контейнер для диска */
    .disk-container {
        position: relative;
        width: 90vw;
        height: 90vw;
        max-width: 600px;
        max-height: 600px;
        margin-top: 20px;
    }

    /* 2. Вращающийся диск с номерами */
    #disk {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: transform;
        z-index: 2;
    }

    /* 3. Статичный слой с линиями (рисунок) */
    #drawing {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 3;
        pointer-events: none; /* Чтобы не мешал нажатиям */
    }

    /* Стили для линий */
    #drawing g {
        stroke: var(--inactive-line);
        stroke-width: 6px;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
    }

    /* Активная линия (для просвечивания) */
    #drawing g.active {
        stroke: var(--active-line);
        stroke-width: 9px;
        filter: drop-shadow(0 0 3px rgba(0,0,0,0.5));
    }

    /* Панель управления */
    .controls {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        z-index: 20;
        padding: 0 20px;
    }

    .btn-row {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 400px;
        justify-content: center;
    }

    button {
        background-color: var(--btn-bg);
        color: #fff;
        border: 1px solid #333;
        padding: 15px 20px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        flex: 1;
        outline: none;
    }

    button:active {
        transform: scale(0.95);
        background-color: #333;
    }

    #nextBtn { background-color: var(--btn-active); border-color: var(--btn-active); }
    #nextBtn:active { background-color: #c0392b; }

    /* Блокировка касаний */
    #lockBtn {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 14px;
        padding: 10px 15px;
        border-radius: 30px;
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        flex: none;
        z-index: 100;
        color: #fff;
    }
    #lockBtn.locked {
        background-color: #ffca3a;
        color: #000;
        border-color: #ffca3a;
    }

    .hint-text {
        position: absolute;
        top: 30px;
        left: 20px;
        font-size: 12px;
        color: #555;
        z-index: 100;
        max-width: 150px;
        line-height: 1.4;
    }
</style>
</head>
<body>

    <!-- Метки по углам для бумаги -->
    <div class="corner-marker top-left"></div>
    <div class="corner-marker top-right"></div>
    <div class="corner-marker bottom-left"></div>
    <div class="corner-marker bottom-right"></div>

    <!-- Кнопка блокировки -->
    <button id="lockBtn">🔓 Касания вкл.</button>
    <div class="hint-text">Приложи лист бумаги и выровняй по углам.</div>

    <!-- Указатель шага -->
    <div class="top-pointer">▼</div>

    <!-- Главный диск -->
    <div class="disk-container">
        <!-- Вращающийся диск с номерами -->
        <svg id="disk" viewBox="-250 -250 500 500">
            <!-- Белая подложка диска -->
            <circle cx="0" cy="0" r="245" fill="var(--disk-bg)" />
            <!-- Декоративное кольцо -->
            <circle cx="0" cy="0" r="230" fill="none" stroke="#e0e0e0" stroke-width="2" />
            
            <!-- Группа для номеров (генерируется через JS) -->
            <g id="numbersGroup"></g>
        </svg>

        <!-- Статичный рисунок -->
        <svg id="drawing" viewBox="-250 -250 500 500">
            <g id="linesGroup"></g>
        </svg>
    </div>

    <!-- Кнопки управления -->
    <div class="controls">
        <div class="btn-row">
            <button id="prevBtn">← Назад</button>
            <button id="resetBtn">Сброс</button>
            <button id="nextBtn">Далее →</button>
        </div>
    </div>

<script>
    const totalSteps = 12;
    let currentStep = 0;
    let isLocked = false;

    const disk = document.getElementById('disk');
    const numbersGroup = document.getElementById('numbersGroup');
    const linesGroup = document.getElementById('linesGroup');

    // 12 шагов рисунка (Котик в медальоне)
    const drawingPaths = [
        // 1. Внешний круг
        `<circle cx="0" cy="0" r="160" />`,
        // 2. Внутренний круг
        `<circle cx="0" cy="0" r="140" />`,
        // 3. Верхняя дуга головы
        `<path d="M -60 -40 A 60 60 0 0 1 60 -40" />`,
        // 4. Нижняя дуга головы
        `<path d="M 60 -40 A 60 60 0 0 0 -60 -40" />`,
        // 5. Левый глаз
        `<circle cx="-25" cy="-30" r="8" />`,
        // 6. Правый глаз
        `<circle cx="25" cy="-30" r="8" />`,
        // 7. Нос и улыбка
        `<path d="M -10 -5 L 10 -5 L 0 5 Z" /><path d="M 0 5 Q -15 15 -25 5 M 0 5 Q 15 15 25 5" />`,
        // 8. Левые усы
        `<path d="M -30 0 L -70 -5 M -30 10 L -70 15" />`,
        // 9. Правые усы
        `<path d="M 30 0 L 70 -5 M 30 10 L 70 15" />`,
        // 10. Левое ухо
        `<path d="M -50 -60 L -90 -110 L -20 -80 Z" />`,
        // 11. Правое ухо
        `<path d="M 50 -60 L 90 -110 L 20 -80 Z" />`,
        // 12. Лапки/Тело
        `<path d="M -40 60 Q -80 120 -40 140 M 40 60 Q 80 120 40 140" />`
    ];

    // 1. Генерация номеров на диске
    for (let i = 0; i < totalSteps; i++) {
        const angle = i * 30;
        const rad = (angle - 90) * Math.PI / 180;
        // Радиус, на котором стоят цифры
        const radius = 200; 
        const x = radius * Math.cos(rad);
        const y = radius * Math.sin(rad);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('font-family', 'sans-serif');
        text.setAttribute('font-weight', '900');
        text.setAttribute('font-size', '36');
        text.setAttribute('fill', '#ddd');
        // Поворачиваем цифру, чтобы она смотрела от центра
        text.setAttribute('transform', `rotate(${angle}, ${x}, ${y})`);
        text.textContent = i + 1;
        text.id = `num-${i}`;
        numbersGroup.appendChild(text);
    }

    // 2. Генерация линий рисунка
    drawingPaths.forEach((path, i) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('id', `line-${i}`);
        g.innerHTML = path;
        linesGroup.appendChild(g);
    });

    // 3. Обновление состояния интерфейса
    function updateUI() {
        // Вращаем диск так, чтобы текущий шаг (currentStep) оказался вверху (0 градусов)
        const rotationAngle = -(currentStep * 30);
        disk.style.transform = `rotate(${rotationAngle}deg)`;

        // Обновляем активные линии и цифры
        for (let i = 0; i < totalSteps; i++) {
            const lineG = document.getElementById(`line-${i}`);
            const numText = document.getElementById(`num-${i}`);

            if (i === currentStep) {
                lineG.classList.add('active');
                numText.setAttribute('fill', 'var(--btn-active)'); // Красный для активного
                numText.setAttribute('font-size', '44'); // Увеличиваем активную цифру
            } else {
                lineG.classList.remove('active');
                numText.setAttribute('fill', '#ddd');
                numText.setAttribute('font-size', '36');
            }
        }
    }

    // 4. Обработчики кнопок
    document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentStep < totalSteps - 1) {
            currentStep++;
            updateUI();
        } else {
            // Если это последний шаг, можно показать финальное сообщение
            document.getElementById('nextBtn').innerText = 'Готово! 🎉';
            setTimeout(() => {
                document.getElementById('nextBtn').innerText = 'Далее →';
            }, 2000);
        }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentStep > 0) {
            currentStep--;
            updateUI();
        }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        currentStep = 0;
        updateUI();
    });

    // 5. Логика блокировки касаний
    document.getElementById('lockBtn').addEventListener('click', (e) => {
        isLocked = !isLocked;
        const btn = e.target;
        
        if (isLocked) {
            btn.innerHTML = '🔒 Заблокировано';
            btn.classList.add('locked');
            disk.style.pointerEvents = 'none'; // Отключаем свайпы
        } else {
            btn.innerHTML = '🔓 Касания вкл.';
            btn.classList.remove('locked');
            disk.style.pointerEvents = 'auto';
        }
    });

    // Инициализация
    updateUI();
</script>
</body>
</html>
