<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>День родного языка 💬</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1512;
    --gold: #d4af37;
    --cream: #f4f1de;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 50%, #2c241c 0%, var(--bg) 100%);
    color: var(--cream); font-family: 'Nunito', sans-serif;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center;
  }
  .back { position: absolute; top: 20px; left: 20px; color: var(--gold); text-decoration: none; font-weight: 800; z-index: 10; font-family: 'Playfair Display', serif; }
  
  header { text-align: center; position: absolute; top: 40px; z-index: 10; pointer-events: none; }
  header h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2rem; }
  header p { color: #a49b8c; font-size: 0.9rem; margin-top: 5px; }

  /* 3D сцена */
  .scene {
    width: 100%; height: 100%; perspective: 1000px; display: flex; align-items: center; justify-content: center;
  }
  .word-cloud {
    width: 300px; height: 300px; position: relative; transform-style: preserve-3d;
    animation: rotateCloud 20s linear infinite;
  }
  @keyframes rotateCloud {
    0% { transform: rotateX(-10deg) rotateY(0deg); }
    100% { transform: rotateX(-10deg) rotateY(360deg); }
  }
  
  .word {
    position: absolute; left: 50%; top: 50%;
    font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700;
    color: var(--cream); cursor: pointer; transition: color 0.3s, text-shadow 0.3s;
    transform-origin: center; backface-visibility: hidden; white-space: nowrap;
  }
  .word:hover { color: var(--gold); text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }

  /* Модалка */
  .modal {
    position: fixed; inset: 0; background: rgba(26, 21, 18, 0.9); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  .modal.on { opacity: 1; pointer-events: auto; }
  
  .modal-card {
    background: #241d18; border: 1px solid var(--gold); border-radius: 16px;
    padding: 40px 30px; max-width: 350px; width: 90%; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative;
    transform: translateY(20px); transition: transform 0.4s;
  }
  .modal.on .modal-card { transform: translateY(0); }
  
  .modal-card h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2rem; margin-bottom: 10px; }
  .modal-card .lang { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #8a7f6c; margin-bottom: 20px; display: block; }
  .modal-card p { color: var(--cream); line-height: 1.6; font-size: 1.05rem; margin-bottom: 30px; }
  .modal-card button {
    background: var(--gold); color: #000; border: none; padding: 12px 24px;
    border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%;
    font-family: 'Nunito', sans-serif;
  }
</style>
</head>
<body>

<a href="index.html" class="back">← На главную</a>
<header>
  <h1>Слова, которые нас связывают</h1>
  <p>Покрути облако и нажми на слово</p>
</header>

<div class="scene">
  <div class="word-cloud" id="cloud">
    <!-- Слова будут добавлены через JS -->
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="mWord">Слово</h2>
    <span class="lang" id="mLang">Язык</span>
    <p id="mText">Значение...</p>
    <button onclick="closeModal()">Жақсы! ❤️</button>
  </div>
</div>

<script>
  // Слова и их значения
  const words = [
    { w: "Махаббат", lang: "Қазақша", text: "Любовь. Это то, что я чувствую к тебе каждую секунду, даже когда мы на разных концах Земли." },
    { w: "Сүйіспеншілік", lang: "Қазақша", text: "Нежность и привязанность. То тепло, которое согревает меня, когда я слышу твой голос." },
    { w: "Love", lang: "English", text: "Самый универсальный язык. Тебе не нужен переводчик, чтобы понять, как сильно я тебя жду." },
    { w: "Home", lang: "English", text: "Дом. Раньше это было место. Теперь это ты. Где бы ты ни была, я чувствую себя дома рядом с тобой." },
    { w: "Счастье", lang: "Русский", text: "Это наши созвоны до утра, твой смех и планирование нашего будущего." },
    { w: "Робот", lang: "Русский", text: "С этого началась наша история. Железо, провода и два человека, которые нашли друг друга." },
    { w: "Жүрек", lang: "Қазақша", text: "Сердце. Оно бьется чаще, когда я вижу уведомление от тебя." },
    { w: "Аэропорт", lang: "Русский", text: "Место, где мы расставались со слезами, и место, где мы будем плакать от счастья при встрече." }
  ];

  const cloud = document.getElementById('cloud');
  const radius = 150; // Радиус сферы

  words.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'word';
    el.innerText = item.w;
    
    // Магия 3D: распределяем слова по сфере
    const phi = Math.acos(-1 + (2 * i) / words.length);
    const theta = Math.sqrt(words.length * Math.PI) * phi;
    
    const x = radius * Math.cos(theta) * Math.sin(phi);
    const y = radius * Math.sin(theta) * Math.sin(phi);
    const z = radius * Math.cos(phi);
    
    // Применяем трансформации и компенсируем центрирование
    el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${-theta}rad) rotateX(${phi}rad)`;
    
    el.onclick = () => openModal(item);
    cloud.appendChild(el);
  });

  function openModal(item) {
    document.getElementById('mWord').innerText = item.w;
    document.getElementById('mLang').innerText = item.lang;
    document.getElementById('mText').innerText = item.text;
    document.getElementById('modal').classList.add('on');
    
    // Останавливаем вращение при клике
    document.getElementById('cloud').style.animationPlayState = 'paused';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('on');
    document.getElementById('cloud').style.animationPlayState = 'running';
  }
</script>
</body>
</html>
