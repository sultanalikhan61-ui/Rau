<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ошибка 404 🤡</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bangers&family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --hacker: #00ff00;
    --red: #ff0000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg); color: var(--hacker);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  
  /* Матрица (фон) */
  #matrix {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    opacity: 0.3; pointer-events: none;
  }

  .content {
    position: relative; z-index: 10; text-align: center; padding: 20px;
    max-width: 600px;
  }

  /* Экран 1: Взлом */
  .screen-hack {
    display: flex; flex-direction: column; align-items: center;
  }
  .screen-hack h1 {
    color: var(--red); font-size: 3rem; text-transform: uppercase;
    text-shadow: 0 0 20px var(--red); animation: blink 0.5s infinite;
    margin-bottom: 20px; font-family: 'Share Tech Mono', monospace;
  }
  .screen-hack p { color: var(--hacker); font-size: 1.2rem; margin-bottom: 30px; }
  
  .loader-bar {
    width: 300px; height: 20px; border: 2px solid var(--hacker); position: relative;
  }
  .loader-fill {
    height: 100%; background: var(--hacker); width: 0%;
    animation: load 3s linear forwards;
  }
  @keyframes load { to { width: 100%; } }
  @keyframes blink { 50% { opacity: 0; } }

  /* Экран 2: Шутка */
  .screen-joke {
    display: none; flex-direction: column; align-items: center;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .screen-joke h1 {
    font-family: 'Bangers', cursive; color: #ffca3a; font-size: 4rem;
    text-shadow: 4px 4px 0 #000; transform: rotate(-5deg); margin-bottom: 20px;
  }
  .screen-joke p {
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.2rem;
    color: #fff; line-height: 1.5; margin-bottom: 30px;
  }
  .btn-love {
    background: #e63946; color: #fff; border: none; padding: 15px 30px;
    border-radius: 30px; font-family: 'Nunito', sans-serif; font-weight: 900;
    font-size: 1.1rem; cursor: pointer; box-shadow: 0 10px 20px rgba(230, 57, 70, 0.4);
    transition: transform 0.2s; text-decoration: none; display: inline-block;
  }
  .btn-love:hover { transform: scale(1.05); }
  .btn-love:active { transform: scale(0.95); }

  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<!-- Фоновая матрица -->
<canvas id="matrix"></canvas>

<div class="content">
  <!-- Первый экран: Типа взлом -->
  <div class="screen-hack" id="hackScreen">
    <h1>WARNING!</h1>
    <p>Система взломана...<br>Доступ к личным файлам Рауанны получен.</p>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <p style="margin-top: 15px; font-size: 0.9rem; color: #888;">Скачивание секретов: 100%</p>
  </div>

  <!-- Второй экран: Романтика -->
  <div class="screen-joke" id="jokeScreen">
    <h1>ШУТКА! 🤡</h1>
    <p>Никакого взлома нет. Я просто хотел сказать, что даже если бы весь мир рухнул, <b>моя любовь к тебе</b> осталась бы неизменной. С 1 апреля, любимая!</p>
    <a href="index.html" class="btn-love">Вернуться в безопасность 🛡️</a>
  </div>
</div>

<script>
  // Логика смены экранов
  setTimeout(() => {
    document.getElementById('hackScreen').style.display = 'none';
    document.getElementById('jokeScreen').style.display = 'flex';
    document.body.style.backgroundColor = '#1a1512'; // Меняем фон
  }, 3500);

  // Эффект падающего кода (Матрица)
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = [];
  for (let x = 0; x < columns; x++) drops[x] = 1;

  function drawMatrix() {
    // Если экран шутки показан, останавливаем матрицу (или делаем ее красивее)
    if (document.getElementById('jokeScreen').style.display === 'flex') {
       ctx.fillStyle = 'rgba(26, 21, 18, 0.1)';
    } else {
       ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    }
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = document.getElementById('jokeScreen').style.display === 'flex' ? '#ffca3a' : '#00ff00';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  setInterval(drawMatrix, 50);

  // Адаптация под ресайз
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
