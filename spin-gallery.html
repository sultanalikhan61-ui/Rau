<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея Шедевров 🎨</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Yeseva+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
    :root {
        --bg: #0f0c29;
        --card-bg: rgba(30, 30, 36, 0.8);
        --text: #fff;
        --gold: #ffca3a;
        --green: #2ed573;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: radial-gradient(circle at 50% 0%, #1e1e24 0%, var(--bg) 100%);
        background-attachment: fixed;
        color: var(--text);
        font-family: 'Nunito', sans-serif;
        min-height: 100vh;
        padding: 20px 15px 60px;
        display: flex; flex-direction: column; align-items: center;
    }
    
    .back { align-self: flex-start; color: var(--gold); text-decoration: none; font-weight: 800; margin-bottom: 20px; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-family: 'Yeseva One', serif; color: var(--gold); font-size: 2rem; }
    header p { color: #a4b0be; font-size: 0.9rem; margin-top: 5px; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 800px;
    }

    .card {
        background: var(--card-bg);
        border: 2px solid rgba(255,255,255,0.05);
        border-radius: 20px;
        padding: 20px;
        position: relative;
        overflow: hidden;
        text-decoration: none;
        color: var(--text);
        display: flex; flex-direction: column; align-items: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .card:hover { transform: translateY(-5px); }
    
    .card-icon {
        font-size: 4rem;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        transition: 0.3s;
    }
    
    .card-title { font-size: 1.1rem; font-weight: 900; text-align: center; margin-bottom: 10px; }
    
    .card-status {
        font-size: 0.8rem; font-weight: 800; padding: 5px 12px; border-radius: 20px;
        display: flex; align-items: center; gap: 5px;
    }

    /* === ЗАБЛЮРЕННЫЕ И НЕИЗВЕСТНЫЕ (locked) === */
    .card.locked {
        cursor: not-allowed;
        opacity: 0.8;
        background: linear-gradient(135deg, #1e1e24 0%, #131317 100%);
        border-color: #333;
    }
    .card.locked:hover { transform: none; }
    
    /* Иконка вопроса для скрытых */
    .card.locked .card-icon {
        color: #555;
        filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
    }
    .card.locked .card-title { color: #666; }
    .card.locked .card-status { background: #222; color: #555; }

    /* === ОТКРЫТЫЕ (done) === */
    .card.done { border-color: var(--green); box-shadow: 0 0 20px rgba(46, 213, 115, 0.15); }
    .card.done .card-icon { filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)); }
    .card.done .card-status { background: rgba(46, 213, 115, 0.2); color: var(--green); }
    
    /* Эффект нажатия */
    .card.done:active { transform: scale(0.95); }
</style>
</head>
<body>

<a href="index.html" class="back">← На главную</a>

<header>
    <h1>Галерея Шедевров</h1>
    <p>Коллекция твоих нарисованных картин</p>
</header>

<div class="grid" id="galleryGrid">
    <p style="text-align: center; grid-column: 1/-1; color: #888;">Загрузка...</p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDrPu0bv13jvnju8JJyHkgeRQcf66fDtlk",
        authDomain: "our-tracker-3cbb5.firebaseapp.com",
        databaseURL: "https://our-tracker-3cbb5-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "our-tracker-3cbb5"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const grid = document.getElementById('galleryGrid');

    db.ref('spin_drawings').on('value', (snapshot) => {
        const data = snapshot.val();
        grid.innerHTML = ''; 

        if (!data) {
            grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #888;">Пока нет рисунков в базе.</p>';
            return;
        }

        // Превращаем объект в массив, чтобы удобно нумеровать
        const itemsArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        
        // Сортируем по времени создания (если есть createdAt), чтобы новые были в конце
        itemsArray.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        itemsArray.forEach((item, index) => {
            const a = document.createElement('a');
            a.className = `card ${item.status}`; 
            
            if (item.status === 'done') {
                a.href = item.url;
            }

            // МАГИЯ ТУТ: Если скрыто, ставим заглушки, чтобы не спалить сюрприз
            let displayIcon = '❓';
            let displayTitle = `Секретный шедевр #${index + 1}`;
            let statusText = 'Не нарисовано';
            let statusIcon = '🔒';

            if (item.status === 'done') {
                displayIcon = item.icon;
                displayTitle = item.title;
                statusText = 'Нарисовано';
                statusIcon = '✅';
            }

            a.innerHTML = `
                <div class="card-icon">${displayIcon}</div>
                <div class="card-title">${displayTitle}</div>
                <div class="card-status">
                    ${statusIcon} ${statusText}
                </div>
            `;
            
            grid.appendChild(a);
        });
    });
</script>
<script src="prank.js"></script>
</body>
</html>
