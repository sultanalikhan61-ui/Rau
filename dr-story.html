<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Наша история 📖</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet"><link rel="stylesheet" href="dr.css?v=3"></head>
<body><div class="wrap"><div id="nav"></div>
<h1>Наша история</h1><p class="sub">Прокручивай вниз, история появляется по шагам</p>
<div class="card"><div class="big" id="dd" style="font-size:3rem">0</div><p class="msg" style="margin-top:0">дней ты делаешь этот мир ярче</p></div>
<div class="tl" id="tl"></div>
<div class="card"><h2>💖 Почему я тебя люблю</h2><p class="hint">Нажимай на карточки.</p><div class="fg" id="fg"></div></div></div><script src="dr-common.js?v=1"></script><script>document.getElementById('nav').innerHTML=NAV('dr-story.html');tg('🎂 <b>Рауанна на странице «Наша история»</b>');

// Правьте даты и тексты здесь. Точные даты, которые я не знаю, можно дописать.
const EV=[['🌸','4 марта 2003','Ты появилась на свет','В этот день мир стал чуточку добрее и умнее.'],['🎓','Годы учёбы','Политех Алматы','Биомедицинская инженерия, магистратура. Много задач, ночей и побед.'],['🤖','Однажды на работе','Мы встретились','Оба учили детей 1–4 классов легороботехнике. Я ещё не знал, что это будет самая важная встреча.'],['✈️','Когда ты закончила магистратуру','Ты полетела за мечтой','Британия, робототехника, новая страна и новые вершины.'],['💞','Каждый день','Километры нас не разлучили','Звонки, аниме, сэндвичи и сайт, который я делаю для тебя.'],['🎂','Сегодня','Тебе '+AGE(new Date()),'И впереди столько всего интересного, и мы пройдём это вместе.']];
EV.forEach(([i,w,t,p])=>document.getElementById('tl').insertAdjacentHTML('beforeend',`<div class="ev" data-i="${i}"><small>${w}</small><h2>${t}</h2><p>${p}</p></div>`));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');if(e.target.textContent.includes('Мы встретились'))confetti(innerWidth/2,innerHeight/2,50)}}),{threshold:.4});document.querySelectorAll('.ev').forEach(e=>io.observe(e));
const d=Math.floor((new Date()-new Date(2003,2,4))/864e5);let c=0;const di=setInterval(()=>{c+=Math.ceil(d/40);if(c>=d){c=d;clearInterval(di)}document.getElementById('dd').textContent=c.toLocaleString('ru-RU')},30);
['Твой ум','Твоё упорство','Твоя улыбка','Твоя забота','Твой смех','С тобой спокойно'].forEach((t,i)=>{const f=document.createElement('div');f.className='fc';f.innerHTML=`<div class="fi"><div class="a">💗</div><div class="b">${t}</div></div>`;f.onclick=()=>{f.classList.toggle('f');if(f.classList.contains('f'))tg('💖 Открыла карточку: '+t)};document.getElementById('fg').appendChild(f)});</script></body></html>
