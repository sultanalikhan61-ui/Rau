<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Новогодняя Комната 🎄</title>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #070b14;
    --gold: #ffd56b;
    --rose: #ff6b81;
    --wood: #3e2723;
    --fire: #ff7f50;
}
* { box-sizing: border-box; }
html, body {
    margin: 0; min-height: 100vh; color: #fff; font-family: 'Nunito', sans-serif;
    background: radial-gradient(circle at 50% 0%, #17233d 0%, var(--bg) 100%);
    overflow-x: hidden; overflow-y: auto;
}
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* === ОБЩАЯ КОМНАТА === */
.room {
    position: relative; width: 100%; max-width: 800px; margin: 0 auto;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding-bottom: 50px;
}

/* === КАМИН === */
.fireplace {
    position: absolute; top: 15%; left: 5%; width: 280px; height: 220px;
    background: #1a1512; border-radius: 10px 10px 0 0; border: 4px solid var(--wood);
    box-shadow: 0 0 30px rgba(255, 127, 80, 0.2); z-index: 2;
}
.fireplace::before { /* Кирпичи */
    content: ''; position: absolute; inset: 0;
    background-image: 
        linear-gradient(335deg, transparent 75%, rgba(0,0,0,0.4) 75%),
        linear-gradient(25deg, transparent 75%, rgba(0,0,0,0.4) 75%);
    background-size: 40px 20px; opacity: 0.3;
}
.fire {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 80px;
    background: radial-gradient(ellipse at bottom, #fff 0%, var(--fire) 40%, #d32f2f 80%, transparent 100%);
    border-radius: 50% 50% 20% 20%; filter: blur(4px);
    animation: flicker 0.1s infinite alternate; transform-origin: bottom center;
}
@keyframes flicker { 100% { transform: translateX(-50%) scale(1.05) skewX(2deg); opacity: 0.9; } }
.logs { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 140px; height: 30px; background: #4e342e; border-radius: 10px; box-shadow: inset 0 5px 10px #000; z-index: 2;}

/* === НОСКИ === */
.stockings-container {
    position: absolute; top: -40px; left: 20px; width: 240px; display: flex; justify-content: space-between; z-index: 5;
}
.stocking {
    width: 50px; height: 70px; background: #c0392b; border-radius: 10px 10px 25px 25px;
    position: relative; cursor: pointer; transition: transform 0.3s; border: 2px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
.stocking::before { content: ''; position: absolute; top: -5px; left: -5px; width: 60px; height: 15px; background: #fff; border-radius: 10px; }
.stocking:hover { transform: translateY(10px) scale(1.05); }
.stocking:nth-child(2) { background: #27ae60; }
.stocking:nth-child(3) { background: #2980b9; }

/* === ЁЛКА === */
.tree-container {
    position: relative; margin-top: 250px; z-index: 3;
    width: 100%; display: flex; justify-content: center; filter: drop-shadow(0 0 40px rgba(31, 138, 91, 0.3));
}
.tree-container svg { width: 100%; max-width: 350px; height: auto; overflow: visible; }
.tier { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); opacity: 0; transition: transform .8s cubic-bezier(.3,1.6,.5,1), opacity .5s; }
.tier.on { transform: scale(1); opacity: 1; }
#star { opacity: 0.2; transition: 1s; transform-origin: center; }
#star.on { opacity: 1; filter: drop-shadow(0 0 20px var(--gold)); animation: tw 2s infinite; }
@keyframes tw { 50% { transform: scale(1.1); } }

/* === ПЕРСОНАЖИ === */
.character {
    position: absolute; width: 100px; cursor: pointer; transition: 0.3s;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); z-index: 10;
}
.character:hover { transform: scale(1.1) translateY(-10px); }
.olaf { right: 5%; top: 35%; width: 120px; animation: float 3s ease-in-out infinite; }
.elsa { right: 2%; top: 18%; width: 90px; animation: float 4s ease-in-out infinite reverse; }
@keyframes float { 50% { transform: translateY(-15px); } }

/* === САНТА === */
.santa {
    position: fixed; bottom: 10vh; left: -150px; width: 130px; z-index: 60;
    transition: transform 7s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 15px rgba(255, 213, 107, 0.8));
}
.santa.fly { transform: translateX(120vw) translateY(-30vh); }

/* === ИНТЕРФЕЙС === */
.ui-layer {
    position: relative; z-index: 20; width: 100%; max-width: 640px; margin-top: 40px; padding: 0 15px;
}
.panel {
    background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
    padding: 20px; margin-bottom: 20px; text-align: center;
}
.panel h1 { font-family: 'Yeseva One', serif; color: var(--gold); margin: 0 0 10px; font-size: 2rem; }
.panel p { opacity: 0.8; font-size: 0.95rem; margin-bottom: 15px; }
.btn {
    background: linear-gradient(135deg, #ffd56b, #f39c12); color: #000;
    border: none; padding: 12px 24px; border-radius: 14px; font-weight: 900; font-size: 1rem;
    cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(255,213,107,0.3);
}
.btn:active { transform: scale(0.95); }
.btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }

/* Модалка */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal.on { display: flex; }
.note { background: #fff7e6; color: #3b2a1a; border-radius: 24px; padding: 30px; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes pop { from { transform: scale(0.5); opacity: 0; } }
.note h2 { color: #c0392b; font-family: 'Yeseva One', serif; margin-top: 0; }
.note button { background: var(--rose); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 800; width: 100%; margin-top: 15px; cursor: pointer; }

@media (max-width: 768px) {
    .fireplace { top: 10%; left: 50%; transform: translateX(-50%); width: 250px; }
    .tree-container { margin-top: 220px; }
    .olaf { top: 45%; right: -10px; width: 90px; }
    .elsa { top: 25%; right: -5px; width: 70px; }
}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="room">
    <!-- КАМИН -->
    <div class="fireplace" id="fireplace" onclick="playFire()">
        <div class="stockings-container">
            <div class="stocking" onclick="openStocking(1)"></div>
            <div class="stocking" onclick="openStocking(2)"></div>
            <div class="stocking" onclick="openStocking(3)"></div>
        </div>
        <div class="fire"></div>
        <div class="logs"></div>
    </div>

    <!-- ПЕРСОНАЖИ (Надежные картинки) -->
    <img src="https://pngimg.com/uploads/snowman/snowman_PNG49.png" class="character olaf" alt="Олаф" onclick="triggerSnow()">
    <img src="https://pngimg.com/uploads/princess/princess_PNG10228.png" class="character elsa" alt="Эльза" onclick="triggerSnow()">
    
    <!-- САНТА -->
    <img src="https://pngimg.com/uploads/santa_claus/santa_claus_PNG38399.png" class="santa" id="santaImg" alt="Санта">

    <!-- ЁЛКА -->
    <div class="tree-container">
        <svg id="scene" viewBox="0 0 360 450">
            <!-- Сюда JS сгенерирует красивую ёлку -->
        </svg>
    </div>

    <!-- ИНТЕРФЕЙС -->
    <div class="ui-layer">
        <div class="panel">
            <h1>С Новым 2027!</h1>
            <p>Нажми на носки над камином, погладь Олафа или запусти Санту!</p>
            <button class="btn" onclick="launchSanta()">🎅 Запустить Санту</button>
            <button class="btn btn-outline" onclick="lightTree()" style="margin-left: 8px;">✨ Зажечь ёлку</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="modal">
    <div class="note">
        <h2 id="modalTitle">Сюрприз!</h2>
        <p id="modalText">Текст...</p>
        <button onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
const $=s=>document.querySelector(s);

// === СНЕГ ===
const cv=$('#fx'),c=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const snow=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,s:0.5+Math.random()*1.5,d:Math.random()*6}));
let mx=W/2;
addEventListener('pointermove',e=>{mx=e.clientX});

(function loop(){
    c.clearRect(0,0,W,H);
    const wind=(mx-W/2)/W*2.5;
    c.fillStyle='rgba(255,255,255,.8)';
    for(const f of snow){
        f.d+=0.02; f.y+=f.s; f.x+=Math.sin(f.d)*0.8+wind;
        if(f.y>H){f.y=-5;f.x=Math.random()*W}
        if(f.x>W)f.x=0; if(f.x<0)f.x=W;
        c.beginPath();c.arc(f.x,f.y,f.r,0,6.283);c.fill();
    }
    requestAnimationFrame(loop);
})();

// === ЗВУКИ (Web Audio API) ===
let ac;
function chime(freq=880, type='sine') {
    try {
        ac = ac || new AudioContext();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.1, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + 1);
    } catch(e) {}
}

function playFire() {
    chime(150, 'sawtooth');
}

// === НОСКИ ===
const stockingTexts = [
    "В этом носке спрятан билет в кино на наше первое свидание в новом году! 🍿",
    "Здесь лежит обещание: я приготовлю твой любимый сэндвич с курицей, как только ты прилетишь. 🥪",
    "А тут — 1000 виртуальных поцелуев и крепких объятий на расстоянии! 💋"
];
function openStocking(num) {
    chime(600 + num * 100);
    $('#modalTitle').innerText = `Носок #${num}`;
    $('#modalText').innerText = stockingTexts[num - 1];
    $('#modal').classList.add('on');
}

// === САНТА ===
let isFlying = false;
function launchSanta() {
    if(isFlying) return;
    isFlying = true;
    const s = $('#santaImg');
    s.classList.add('fly');
    chime(400, 'triangle');
    
    setTimeout(() => {
        s.classList.remove('fly');
        isFlying = false;
        triggerFireworks();
    }, 7000);
}

// === ОЛАФ И ЭЛЬЗА ===
function triggerSnow() {
    chime(1000);
    for(let i=0;i<50;i++) {
        snow.push({x:Math.random()*W, y:-10, r:2+Math.random()*4, s:3+Math.random()*4, d:Math.random()*6});
    }
    triggerFireworks();
}

// === ЁЛКА (Премиум SVG) ===
let treeLit = false;
function lightTree() {
    if(treeLit) return;
    treeLit = true;
    document.querySelectorAll('.tier').forEach((t, i) => {
        setTimeout(() => { t.classList.add('on'); chime(400 + i*100); }, i * 300);
    });
    setTimeout(() => { $('#star').classList.add('on'); triggerFireworks(); }, 1200);
}

function triggerFireworks() {
    // Просто добавляем много искр на снег для эффекта
    for(let i=0;i<100;i++) {
        snow.push({x:W/2, y:H/2, r:2, s:Math.random()*5-2.5, d:Math.random()*6, isSpark:true});
    }
}

// Инициализация Ёлки (Красивый SVG)
(function() {
    const NS = '<defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ecc71"/><stop offset="1" stop-color="#0a3d26"/></linearGradient></defs>';
    let h = NS;
    
    // Основа
    h += '<rect x="165" y="330" width="30" height="50" rx="5" fill="#3e2723"/>';
    
    // Ярусы ёлки (реалистичные ветки)
    const levels = [[220, 320, 130], [160, 250, 100], [100, 180, 70], [40, 110, 45]];
    levels.forEach(([top, bot, width], i) => {
        let d = `M180,${top} `;
        for(let k=0; k<8; k++) d += `Q${180+width-(width/4)*(k+0.5)},${bot+10} ${180+width-(width/4)*(k+1)},${bot} `;
        d += `L180,${bot} L${180-width},${bot} `;
        for(let k=0; k<8; k++) d += `Q${180-width+(width/4)*(k+0.5)},${bot+10} ${180-width+(width/4)*(k+1)},${bot} `;
        d += 'Z';
        
        h += `<g class="tier"><path d="${d}" fill="url(#gp)" stroke="#1a5c38" stroke-width="2"/>`;
        
        // Игрушки
        for(let j=0; j<5; j++) {
            const y = top + (bot-top)*(0.3 + 0.15*j);
            const hw = width * (y-top)/(bot-top) * 0.8;
            const x = 180 + ((j%2)?1:-1) * hw * (0.3 + 0.4*Math.random());
            h += `<circle cx="${x}" cy="${y}" r="${7-i}" fill="${['#e74c3c','#f1c40f','#3498db','#fff'][(i+j)%4]}" stroke="#fff" stroke-opacity=".5"/>`;
        }
        h += '</g>';
    });
    
    // Звезда
    h += '<polygon id="star" fill="#ffd56b" points="180,20 190,50 220,50 195,70 205,100 180,80 155,100 165,70 140,50 170,50"/></g>';
    
    document.getElementById('scene').innerHTML = h;
})();

// === МОДАЛКА ===
function closeModal() { $('#modal').classList.remove('on'); }
$('#modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };

</script>
</body>
</html>
