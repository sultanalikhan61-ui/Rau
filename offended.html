<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Space+Mono&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050608;
        --text: #d1d5db;
        --accent: #991b1b;
        --accent-glow: rgba(153, 27, 27, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
        background-color: var(--bg);
        background: radial-gradient(circle at 50% 0%, #1a1c23 0%, #050608 80%);
        color: var(--text);
        font-family: 'Nunito', sans-serif;
        min-height: 100vh;
        overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    /* Эффект дождя */
    #rainCanvas {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* Экран 1: Дверь закрыта */
    #gate {
        position: fixed; inset: 0; z-index: 100;
        background: var(--bg); display: flex; flex-direction: column;
        align-items: center; justify-content: center; transition: opacity 1s;
    }
    #gate.open { opacity: 0; pointer-events: none; }
    
    .gate-btn {
        width: 100px; height: 100px; border-radius: 50%;
        border: 2px solid #333; background: transparent;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.4s;
        position: relative;
    }
    .gate-btn::before {
        content: ''; position: absolute; inset: -10px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05); animation: pulse 2s infinite;
    }
    .gate-btn svg { width: 40px; height: 40px; fill: #555; transition: 0.4s; }
    .gate-btn:hover { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); }
    .gate-btn:hover svg { fill: var(--accent); transform: scale(1.1); }
    
    .gate-text { margin-top: 30px; font-family: 'Space Mono', monospace; font-size: 12px; color: #555; letter-spacing: 2px; text-transform: uppercase; }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
    }

    /* Основной контент */
    .content-wrapper {
        position: relative; z-index: 10;
        max-width: 650px; width: 90%;
        opacity: 0; transition: opacity 2s ease 1s;
    }
    .content-wrapper.show { opacity: 1; }

    .terminal {
        background: rgba(10, 12, 16, 0.8);
        border: 1px solid #222;
        border-top: 3px solid var(--accent);
        border-radius: 0 0 12px 12px;
        padding: 30px 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
        position: relative;
    }

    .terminal-header {
        display: flex; gap: 6px; margin-bottom: 25px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
    .dot.red { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    .typing-text {
        font-family: 'Space Mono', monospace;
        font-size: 1.05rem;
        line-height: 1.7;
        color: #a1a1aa;
        min-height: 250px;
        white-space: pre-wrap;
    }

    .cursor {
        display: inline-block; width: 10px; height: 1.1rem;
        background-color: var(--accent); vertical-align: middle;
        animation: blink 1s step-end infinite; margin-left: 4px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Кнопки после текста */
    .actions {
        display: none; margin-top: 30px; gap: 15px; justify-content: space-between;
        border-top: 1px solid #222; padding-top: 20px;
    }
    .actions.show { display: flex; animation: fadeIn 1s; }
    
    .btn {
        flex: 1; padding: 15px; border-radius: 8px; font-family: 'Nunito', sans-serif;
        font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.3s;
        text-align: center; text-decoration: none;
    }
    .btn-silent {
        background: transparent; border: 1px solid #444; color: #888;
    }
    .btn-silent:hover { border-color: #fff; color: #fff; }
    
    .btn-talk {
        background: var(--accent); border: 1px solid var(--accent); color: #fff;
        box-shadow: 0 0 20px var(--accent-glow);
    }
    .btn-talk:hover { background: #b91c1c; transform: translateY(-2px); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .heart-bg {
        position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
        font-size: 3rem; filter: grayscale(1) drop-shadow(0 0 10px rgba(153, 27, 27, 0.5));
        opacity: 0.5; animation: brokenHeart 3s infinite ease-in-out;
    }
    @keyframes brokenHeart {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(0.95); opacity: 0.3; }
    }
</style>
</head>
<body>

<canvas id="rainCanvas"></canvas>

<!-- Экран блокировки -->
<div id="gate">
    <div class="gate-btn" onclick="openLetter()">
        <svg viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm4 9h-2v3h2v-3z"/></svg>
    </div>
    <div class="gate-text">Нажми, чтобы открыть</div>
</div>

<!-- Основной контент -->
<div class="content-wrapper" id="contentWrapper">
    <div class="heart-bg">💔</div>
    
    <div class="terminal">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <div class="typing-text" id="typingText"></div>
        
        <div class="actions" id="actions">
            <a href="index.html" class="btn btn-silent">Мне нужно время...</a>
            <a href="https://t.me/" target="_blank" class="btn btn-talk">Давай поговорим</a>
        </div>
    </div>
</div>

<script>
    // --- Логика появления текста (Typewriter) ---
    // ВАЖНО: Здесь ты пишешь то, что хочешь ей сказать. Вместо [текста в скобках] вставь свои причины.
    const message = `Рауанна, я пишу это не для того, чтобы устроить скандал. 
Я пишу, потому что мне действительно больно, и я устал делать вид, что всё в порядке.

Меня задело твое отношение. Ты говорила, что у тебя депрессия, что нет сил даже до туалета дойти. 
Я очень ждал нашего звонка на Хэллоуин. Очень. 
А в итоге я вижу, как ты целый день гуляешь по городу. Надеюсь, это стоило того, и ты получила ту самую энергию, которой тебе не хватало.

Обидно и то, что ты просто перестала писать. Сказала «пауза», «без переписок». 
Я знаю, как это будет дальше. Когда ты соизволишь вернуться, ты просто забудешь эти дни. Тебе нечего будет мне сказать. Ты либо намеренно будешь упускать эти моменты, либо ответишь сухо и холодно.

И я делаю выводы. 
Если у тебя есть силы гулять, общаться, искать новые знакомства и ловить «студенческий вайб», но нет сил написать мне — значит, дело не в депрессии. 
Есть силы, просто не на меня. 

Я вижу, что тебе нужно внимание и поддержка от окружения, тусовок и встреч. 
Семья для тебя, похоже, это просто способ самоутверждения. А не то место, где ты ищешь истинное счастье и покой.

Я понимаю: учеба, Британия, стресс. Но я тоже живой человек. 
И когда я жду твоего сообщения весь день, а в ответ получаю сухое «привет» — я чувствую, что я в этих отношениях один.

Расстояние измеряется не километрами. Оно измеряется тем, как мы общаемся. 
Я очень сильно тебя люблю. Но любовь не должна причинять столько боли. 
Пожалуйста, подумай над этим.`;

    let i = 0;
    let isTyping = false;
    let typingInterval;

    function openLetter() {
        document.getElementById('gate').classList.add('open');
        setTimeout(() => {
            document.getElementById('contentWrapper').classList.add('show');
            startTyping();
        }, 500);
    }

    function startTyping() {
        const el = document.getElementById('typingText');
        el.innerHTML = '';
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        el.appendChild(cursor);

        isTyping = true;
        i = 0;

        function type() {
            if (i < message.length) {
                cursor.before(document.createTextNode(message.charAt(i)));
                i++;
                let delay = 40; // Скорость печати
                if (message.charAt(i-1) === '\n') delay = 500; // Пауза на переносе строки
                if (message.charAt(i-1) === '.') delay = 300; // Пауза на точке
                typingInterval = setTimeout(type, delay);
            } else {
                isTyping = false;
                cursor.remove();
                document.getElementById('actions').classList.add('show');
            }
        }
        type();
    }

    // --- Эффект дождя (Canvas) ---
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const drops = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        drops.length = 0;
        for (let i = 0; i < 150; i++) {
            drops.push({
                x: Math.random() * w,
                y: Math.random() * h,
                len: Math.random() * 20 + 10,
                speed: Math.random() * 10 + 10,
                opacity: Math.random() * 0.2 + 0.1
            });
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function drawRain() {
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        drops.forEach(d => {
            ctx.globalAlpha = d.opacity;
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 2, d.y + d.len);
            ctx.stroke();
            
            d.y += d.speed;
            d.x -= 0.5;
            
            if (d.y > h) {
                d.y = -20;
                d.x = Math.random() * w;
            }
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(drawRain);
    }
    drawRain();

    // --- Генерация звука дождя (Web Audio API) ---
    let audioCtx;
    function playRainSound() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;
            whiteNoise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.03;

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            whiteNoise.start();
        } catch(e) {}
    }

    // Запускаем звук при первом клике (браузеры блокируют автоплей)
    document.getElementById('gate').addEventListener('click', () => {
        playRainSound();
    }, { once: true });
</script>
</body>
</html>
