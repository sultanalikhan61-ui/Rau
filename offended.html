<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Space+Mono&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050608;
        --text: #d1d5db;
        --accent: #991b1b;
        --accent-glow: rgba(153, 27, 27, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
        background-color: var(--bg);
        background: radial-gradient(circle at 50% 0%, #1a1c23 0%, #050608 80%);
        color: var(--text);
        font-family: 'Nunito', sans-serif;
        min-height: 100vh;
        overflow-x: hidden; 
        overflow-y: auto;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding: 40px 0; 
    }

    /* Эффект дождя */
    #rainCanvas {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* Экран 1: Дверь закрыта */
    #gate {
        position: fixed; inset: 0; z-index: 100;
        background: var(--bg); display: flex; flex-direction: column;
        align-items: center; justify-content: center; transition: opacity 1s;
    }
    #gate.open { opacity: 0; pointer-events: none; }
    
    .gate-btn {
        width: 100px; height: 100px; border-radius: 50%;
        border: 2px solid #333; background: transparent;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.4s;
        position: relative;
    }
    .gate-btn::before {
        content: ''; position: absolute; inset: -10px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05); animation: pulse 2s infinite;
    }
    .gate-btn svg { width: 40px; height: 40px; fill: #555; transition: 0.4s; }
    .gate-btn:hover { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); }
    .gate-btn:hover svg { fill: var(--accent); transform: scale(1.1); }
    
    .gate-text { margin-top: 30px; font-family: 'Space Mono', monospace; font-size: 12px; color: #555; letter-spacing: 2px; text-transform: uppercase; }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
    }

    /* Основной контент */
    .content-wrapper {
        position: relative; z-index: 10;
        max-width: 650px; width: 90%;
        opacity: 0; transition: opacity 2s ease 1s;
    }
    .content-wrapper.show { opacity: 1; }

    .terminal {
        background: rgba(10, 12, 16, 0.8);
        border: 1px solid #222;
        border-top: 3px solid var(--accent);
        border-radius: 0 0 12px 12px;
        padding: 30px 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
        position: relative;
    }

    .terminal-header {
        display: flex; gap: 6px; margin-bottom: 25px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
    .dot.red { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    .typing-text {
        font-family: 'Space Mono', monospace;
        font-size: 1.05rem;
        line-height: 1.7;
        color: #a1a1aa;
        min-height: 250px;
        white-space: pre-wrap;
    }

    .cursor {
        display: inline-block; width: 10px; height: 1.1rem;
        background-color: var(--accent); vertical-align: middle;
        animation: blink 1s step-end infinite; margin-left: 4px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .heart-bg {
        position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
        font-size: 3rem; filter: grayscale(1) drop-shadow(0 0 10px rgba(153, 27, 27, 0.5));
        opacity: 0.5; animation: brokenHeart 3s infinite ease-in-out;
    }
    @keyframes brokenHeart {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(0.95); opacity: 0.3; }
    }
</style>
</head>
<body>

<canvas id="rainCanvas"></canvas>

<!-- Экран блокировки -->
<div id="gate">
    <div class="gate-btn" onclick="openLetter()">
        <svg viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm4 9h-2v3h2v-3z"/></svg>
    </div>
    <div class="gate-text">Эта страница содержит глубокое и личное сообщение. Боль, страхи, разочарования. Ложные ожидания и надежды. Уверена что хочешь прочитать?</div>
</div>

<!-- Основной контент -->
<div class="content-wrapper" id="contentWrapper">
    <div class="heart-bg">💔</div>
    
    <div class="terminal">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <div class="typing-text" id="typingText"></div>
    </div>
</div>

<script>
    const message = `Рауанна, я пишу это не для того, чтобы устроить скандал. 
Я пишу, потому что мне действительно больно, и я устал делать вид, что всё в порядке.

Меня задело твое отношение. Ты говорила, что у тебя депрессия, что нет сил даже до туалета дойти. 
Я очень ждал нашего звонка на Хэллоуин. Очень. 
А в итоге я вижу, как ты днями гуляешь по городу, находишься у кого-то в гостях. Значит, на это силы есть? Надеюсь, это стоило того. Я в прошлый раз просил тебя не уходить в крайности. (Как собака с цепи). Но всё повторяется. Всегда так происходит. Столько планов было в этом сайте, столько всего хотелось сделать с тобой. 

Обидно и то, что ты просто перестала писать. Сказала «пауза», «без переписок».
Я знаю, как это будет дальше. Когда ты соизволишь вернуться, ты просто забудешь эти дни. Тебе нечего будет мне сказать. Ты либо намеренно будешь упускать эти моменты, либо ответишь сухо и холодно. А когда я об этом пишу, ты говоришь: «Ну я же написала». Интересно, а про встречу девушек с СНГ ты специально забыла? Сухо ответила. Умолчала большинство.

Если у тебя есть силы часами гулять, общаться, искать новые знакомства и ловить «студенческий вайб», но нет сил написать мне — значит, дело не в депрессии. Есть силы, просто не на меня. Ты хочешь снова быть свободной... Тем самым студентом, которому молодость прощает ошибки, можно делать что хочется и быть где хочется. Ощущение будто группаши для тебя и есть семья... Стремишься быть с ними. Хочешь быть с ними. И делать 'всё', что они предлагают... У тебя нет радости в простоте, тебе обязательно нужно где-то быть.

Недавно я видел двух девушек. Они так мило и нежно разговаривали, у одной был грудной ребенок. Вторая так ласково хвалила малыша, они общались на простые темы, обсуждали сериалы. Я смотрел на это и понимал, чего я хочу на самом деле.
Я хочу любящую жену, которой интересно быть дома с мужем. А не ту, которой жизненно необходимы тусовки, гулянки и встречи, где разговоры строятся на крепости алкоголя и черном юморе про секс и инвалидов. Хотелось чтобы 'душа' и интересы были направлены на простые радости, а не на отвратные части нашего мира (гей/трансы/цирк уродов). Если им нужна помощь, я помогу. Ибо каждый человек заслуживает помощи и уважения. Но смотреть как они транслируют себя, никогда не буду. Лучше уж смотреть где растут маковые поля вокруг города. 

Для меня любовь — это что-то настолько высокое, что ее нельзя описать словами. Где нужно все время тянуться друг к другу, несмотря ни на что. А для тебя любовь — это сопутствующая часть жизни, которую можно прожить и без любви. Для тебя это набор функций. Не поддерживает по пунктам — значит, не любит.
Я всегда считал наоборот: ради любви можно и ЖИЗНЬ отдать. Любовь — это когда неважно, какой человек, нужно всегда его любить. Пытаться быть вместе.

У тебя очень много проблем. И я всё равно любил тебя. Со всеми недостатками. Пытался их исправить, говорил, что мне не нравится, и пытался помочь, потому что любил.
Я знал про кисту, спайку матки, эндометриоз. Я знал, как это тяжело, и я принял это. Я выбрал тебя, а не идеальную картинку. Знал я и про твое прошлое. И это не отменяло моих чувств.

Я знаю, что ты росла без отца. Только мама, которая дала тебе свободу и не ограничивала тебя. И я понимаю, что для тебя моя забота и желание защитить кажется контролем. Тебе это непривычно. Ты не знаешь, как это — когда есть мужчина, который говорит «нет» не из вредности, а потому что переживает. У тебя не было строгого "до 18:00 быть дома". Для тебя это тиски. И ты не понимаешь роли мужчины в жизни семьи (то что девушка росла без отца, это ред флаг для нас). Но я не могу быть равнодушным, потому что мне не все равно, что с тобой происходит и куда ты идешь.

Из-за щитовидки у тебя полный сбой по гормонам. Никогда не бывает спокойного состояния. Когда мы проходили тест, нам сказали, что мы как бензин и спичка. Так вот, ты БЕНЗИН. Одно мое слово — спичка. И ты уходишь в разгон по всем фронтам.
Таблетки ежедневные от эндометриоза, которые тоже ломают гормоны. И твоя зависимость от соцсетей. Я ненавижу Инстаграм, потому что вижу, как ты проводишь там часы. Ты ничего не постишь, ты просто смотришь на чужие жизни. Ты хочешь быть как те люди за экраном: успешными, получать много цветов, гулять в разных странах. Тебя угнетает, что в реальности этого нет, и ты пытаешься закрыть эту пустоту, листая чужие картинки. Но пока ты мечтаешь о жизни из ленты, ты не замечаешь реального человека рядом с собой, который любит тебя настоящую, а не отфильтрованную. Для тебя простая жизнь и обычная любовь нечто чужое.

Хотя куда проще найти другую, у которой всё стабильно с психикой, которой не важны тусовки, и которая ценит любовь. Но мне не нужна другая. Я не ищу удобную девушку без проблем. Я хочу тебя. Но я хочу, чтобы ты была рядом со мной в нашей общей жизни, а не жила параллельно.

Я не спорю, у тебя есть ум. Очень крутой. Бакалавр, семестр в Германии, магистратура, месяц в Китае, успехи, выезды за границу. И сейчас магистратура в Британии. Ты станешь успешной. И я восхищаюсь твоим стремлением к росту. Но иногда мне кажется, что ты бежишь не к своему счастью, а от чего-то, пытаясь доказать всем, что ты лучшая. Мне же не нужно, чтобы ты была лучшей. Мне нужно, чтобы ты была моей женой. А я не хочу, чтобы всё это вместе взятое ломало ВСЁ, ЧТО Я ЛЮБЛЮ.

Хочу любви и быть вместе: дела, учеба, работа.
Хочу ласки и общения: гормональные сбои, истерика, ругань, слезы.
Хочу секса: желания нет, больно.
Поругались: хочешь уйти и гулять одна.
Хочу быть дома: хочешь пойти к знакомым и пить там.
Хочу питаться домашней едой: у тебя фастфуд и кола.
Хочу проявлять любовь где угодно, поцеловать на людях, обниматся в парке: только не здесь, не надо, засос виден.

Ты не жена. Ты женщина-босс, которой нужно достичь богатства и успеха в жизни. Как начальница из фильма «Дьявол носит Prada». Для тебя семья — это просто статус. А не то место, куда ты приходишь и прыгаешь в объятия мужа. Для тебя это просто партнерство и галочка «муж/жена». Даже Страница в инсте это твое очередное портфолио. Тип, смотрите где я была и чего достигла. 

Я понимаю, что моя опека душит тебя. Я знаю, что иногда веду себя слишком строго, пытаясь тебя уберечь. И я иду к психологу, чтобы разобраться в себе. Но я не могу перестать переживать за тебя, потому что ты — самый близкий человек в моей жизни.

Я так устал быть один в этих отношениях. Я так устал ждать, когда ты вспомнишь обо мне. Я устал быть тем, кто всегда рядом, когда тебе плохо, но когда тебе хорошо — ты находишся в своей личной жизни. Я выжат до дна. Моя душа сейчас — это выжженная пустыня, в которой я пытаюсь найти хоть каплю твоего тепла. Очень сожалею что ты улетела... А у тебя в планах в дальнейшем летать по другим странам.

Я очень сильно тебя люблю. Я хочу просто обнять тебя. Но любовь не должна причинять столько боли. Скорее всего психолог сказала, не думать обо мне, и идти к своим целям и мечтам. Если ты хочешь уйти — я не буду тебя держать силой. Но знай: я отдал тебе всё, что у меня было. Я принял тебя всю, без остатка. А ты так и не приняла меня. Пожалуйста, подумай над этим.`;

    let i = 0;
    let isTyping = false;
    let typingInterval;

    function openLetter() {
        document.getElementById('gate').classList.add('open');
        
        // Запускаем музыку через 2 секунды после клика
        setTimeout(() => {
            const bgMusic = new Audio('song.mp3');
            bgMusic.loop = true;      
            bgMusic.volume = 0.5;     
            bgMusic.play().catch(e => {
                console.log("Музыка не загрузилась. Убедись, что файл называется song.mp3");
            });
        }, 2000); 

        setTimeout(() => {
            document.getElementById('contentWrapper').classList.add('show');
            startTyping();
        }, 500);
    }

    function startTyping() {
        const el = document.getElementById('typingText');
        el.innerHTML = '';
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        el.appendChild(cursor);

        isTyping = true;
        i = 0;

        function type() {
            if (i < message.length) {
                cursor.before(document.createTextNode(message.charAt(i)));
                i++;
                // Ускорил печать (15мс), чтобы текст не печатался 5 минут
                let delay = 10;
                if (message.charAt(i-1) === '\n') delay = 400; // Пауза на переносе строки
                if (message.charAt(i-1) === '.') delay = 200; // Пауза на точке
                typingInterval = setTimeout(type, delay);
            } else {
                isTyping = false;
                cursor.remove();
                // Убрал ошибку с отсутствующим блоком actions
            }
        }
        type();
    }

    // --- Эффект дождя (Canvas) ---
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const drops = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        drops.length = 0;
        for (let i = 0; i < 150; i++) {
            drops.push({
                x: Math.random() * w,
                y: Math.random() * h,
                len: Math.random() * 20 + 10,
                speed: Math.random() * 10 + 10,
                opacity: Math.random() * 0.2 + 0.1
            });
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function drawRain() {
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        drops.forEach(d => {
            ctx.globalAlpha = d.opacity;
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 2, d.y + d.len);
            ctx.stroke();
            
            d.y += d.speed;
            d.x -= 0.5;
            
            if (d.y > h) {
                d.y = -20;
                d.x = Math.random() * w;
            }
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(drawRain);
    }
    drawRain();
</script>
</body>
</html>
