<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Фортуны ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap');

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #ff4757;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px; overflow-x: hidden;
    }

    header { text-align: center; margin-bottom: 15px; }
    header h1 {
      font-family: 'Fredoka', cursive; font-size: 2.2rem;
      background: linear-gradient(45deg, #ff7675, #fd79a8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .game-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px; padding: 20px 20px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 480px; position: relative;
    }

    /* АНИМИРОВАННЫЙ КРОЛИК 🐰 */
    .rabbit-container {
      width: 90px; height: 80px; position: relative; margin-bottom: -15px; z-index: 20;
    }

    .rabbit {
      width: 100%; height: 100%; position: relative; transition: transform 0.3s ease;
    }

    .rabbit .ear {
      position: absolute; top: 0; width: 14px; height: 35px;
      background: #ffffff; border-radius: 10px 10px 0 0;
      border: 2px solid #333;
    }
    .rabbit .ear::after {
      content:''; position: absolute; top: 6px; left: 2px; width: 6px; height: 20px;
      background: #ff7675; border-radius: 5px;
    }
    .rabbit .ear.left { left: 28px; transform: rotate(-10deg); transform-origin: bottom; }
    .rabbit .ear.right { right: 28px; transform: rotate(10deg); transform-origin: bottom; }

    .rabbit .head {
      position: absolute; bottom: 10px; left: 15px; width: 60px; height: 45px;
      background: #ffffff; border-radius: 30px 30px 20px 20px;
      border: 2px solid #333;
    }

    .rabbit .eye {
      position: absolute; top: 15px; width: 6px; height: 8px; background: #222; border-radius: 50%;
    }
    .rabbit .eye.left { left: 15px; }
    .rabbit .eye.right { right: 15px; }

    .rabbit .paw {
      position: absolute; bottom: 2px; width: 16px; height: 16px;
      background: #ffffff; border-radius: 50%; border: 2px solid #333;
      z-index: 25; transition: transform 0.1s;
    }
    .rabbit .paw.left { left: 18px; }
    .rabbit .paw.right { right: 18px; }

    .spinning .rabbit .ear.left { animation: earWiggle 0.2s infinite alternate; }
    .spinning .rabbit .ear.right { animation: earWiggle 0.2s infinite alternate-reverse; }
    .spinning .rabbit .paw { animation: pawSpin 0.15s infinite alternate; }

    @keyframes earWiggle { 0% { transform: rotate(-15deg); } 100% { transform: rotate(-5deg); } }
    @keyframes pawSpin { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

    .win-jump { animation: rabbitJump 0.6s ease; }
    @keyframes rabbitJump {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.1); }
    }

    /* КОЛЕСО */
    .wheel-outer {
      position: relative; width: 340px; height: 340px;
      border-radius: 50%; padding: 10px;
      background: linear-gradient(135deg, #ff7675, #a29bfe, #fd79a8);
      box-shadow: 0 0 30px rgba(255, 118, 117, 0.4);
    }

    .pointer {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 16px solid transparent; border-right: 16px solid transparent;
      border-top: 28px solid #ffeaa7; z-index: 30;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    canvas {
      width: 100%; height: 100%; border-radius: 50%;
      transition: transform 4.5s cubic-bezier(0.15, 0.95, 0.15, 1);
    }

    /* КНОПКА И РЕЗУЛЬТАТ */
    .spin-btn {
      margin-top: 25px;
      background: linear-gradient(135deg, #ff7675, #d63031);
      color: white; border: none; padding: 16px 45px;
      font-family: 'Fredoka', cursive; font-size: 1.2rem;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 118, 117, 0.4);
      transition: all 0.2s ease;
    }
    .spin-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 30px rgba(255, 118, 117, 0.6); }
    .spin-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

    .result-box {
      margin-top: 15px; font-size: 1.1rem; font-weight: 800;
      color: #ffeaa7; text-align: center; min-height: 48px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 10px;
    }

    /* ИНСТРУМЕНТЫ */
    .tools-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      width: 100%; max-width: 480px; margin-top: 20px;
    }

    .tool-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      padding: 12px; border-radius: 16px; color: var(--text);
      font-size: 0.85rem; font-weight: 700; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      backdrop-filter: blur(5px); transition: 0.2s;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.15); border-color: #ff7675; color: #ff7675; }

    /* МОДАЛКИ */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content {
      background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
      padding: 25px; border-radius: 24px; max-width: 440px; width: 100%; text-align: center; position: relative;
    }
    .close-btn { position: absolute; top: 12px; right: 18px; color: #aaa; cursor: pointer; font-size: 1.3rem; }
    .box-display {
      background: rgba(0,0,0,0.3); border: 1px dashed #a29bfe;
      padding: 18px; border-radius: 16px; margin: 15px 0; font-size: 1.05rem; font-weight: 700; color: #fff;
    }

    .confetti {
      position: fixed; width: 10px; height: 10px; top: -10px;
      z-index: 999; animation: fall 3s linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Колесо Фортуны 🎡</h1>
    <p style="color: var(--subtext); font-size:0.9rem;">Чем займёмся на сегодняшнем созвоне?</p>
  </header>

  <div class="game-card" id="gameCard">
    <div class="rabbit-container">
      <div class="rabbit" id="rabbit">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head">
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
        <div class="paw left"></div>
        <div class="paw right"></div>
      </div>
    </div>

    <div class="wheel-outer">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Крутить колесо! ✨</button>
    <div class="result-box" id="resultBox">Нажми на кнопку, и кролик закрутит колесо!</div>
  </div>

  <div class="tools-grid">
    <button class="tool-btn" onclick="openQuestions()">💬 500 Вопросов</button>
    <button class="tool-btn" onclick="openSketches()">🎨 Идея рисования</button>
    <a href="https://magma.com/" target="_blank" class="tool-btn">🖌️ Magma.com</a>
    <a href="Rau-One.html" class="tool-btn">🎮 Игры для двоих</a>
  </div>

  <!-- МОДАЛКА ВОПРОСОВ -->
  <div class="modal" id="qModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('qModal')">✕</span>
      <h3 style="color: #ff7675;">Разговоры по душам 💬</h3>
      <div class="box-display" id="qText">Загружаем вопрос...</div>
      <button class="spin-btn" style="padding:10px 25px; font-size:1rem;" onclick="getRandomQuestion()">Следующий 🎲</button>
    </div>
  </div>

  <!-- МОДАЛКА РИСУНКОВ -->
  <div class="modal" id="sketchModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('sketchModal')">✕</span>
      <h3 style="color: #fd79a8;">🎨 Идея для рисования</h3>
      <div class="box-display" id="sketchText">Загружаем идею...</div>
      <button class="spin-btn" style="padding:10px 25px; font-size:1rem; background:#fd79a8;" onclick="getRandomSketch()">Сгенерировать 🖌️</button>
    </div>
  </div>

  <script>
    // ПОЛНЫЙ СПИСОК 14 АКТИВНОСТЕЙ
    const items = [
      { text: "🎬 Запланированный фильм", weight: 35, color: "#55efc4" },
      { text: "🇬🇧 1 час English (Учимся вместе)", weight: 15, color: "#ff7675" },
      { text: "💬 10 безобидных вопросов", weight: 8,  color: "#74b9ff" },
      { text: "🎮 Играем в игры для двоих", weight: 8,  color: "#a29bfe" },
      { text: "🎨 Рисуем эскиз на Magma.com", weight: 6,  color: "#fd79a8" },
      { text: "🕯️ Ужин при анимированной свече", weight: 5, color: "#fffa65" },
      { text: "☕ Ночное чаепитие без гаджетов", weight: 4,  color: "#ffeaa7" },
      { text: "📸 Смотрим старые фото и архивы", weight: 4,  color: "#fab1a0" },
      { text: "🗺️ Гуляем по Google Maps", weight: 3,  color: "#81ecec" },
      { text: "🍿 Смотрим мультик из детства", weight: 3,  color: "#74b9ff" },
      { text: "🧩 Проходим онлайн-тест для пар", weight: 3, color: "#a29bfe" },
      { text: "🔮 Квест с Магическим Шаром", weight: 2,  color: "#fd79a8" },
      { text: "✉️ Пишем письмо в будущее на FutureMe", weight: 2, color: "#ff7675" },
      { text: "🎶 Слушаем музыку / Suno треки", weight: 2, color: "#55efc4" }
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const resultBox = document.getElementById("resultBox");
    const gameCard = document.getElementById("gameCard");
    const rabbit = document.getElementById("rabbit");

    const totalItems = items.length;
    const arc = (2 * Math.PI) / totalItems;
    let isSpinning = false;
    let currentRotation = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playWinSound() {
      const notes = [400, 500, 600, 800];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }, idx * 100);
      });
    }

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < totalItems; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = items[i].color;
        ctx.moveTo(160, 160);
        ctx.arc(160, 160, 155, angle, angle + arc);
        ctx.lineTo(160, 160);
        ctx.fill();

        ctx.save();
        ctx.translate(160, 160);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 9px Nunito, sans-serif";
        ctx.fillText(items[i].text, 148, 3);
        ctx.restore();
      }
    }
    drawWheel();

    function getWeightedRandomIndex() {
      const totalWeight = items.reduce((acc, item) => acc + item.weight, 0);
      let random = Math.random() * totalWeight;
      for (let i = 0; i < items.length; i++) {
        if (random < items[i].weight) return i;
        random -= items[i].weight;
      }
      return 0;
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultBox.innerText = "Кролик крутит колесо...";
      gameCard.classList.add("spinning");

      const targetIndex = getWeightedRandomIndex();
      const targetArcCenter = targetIndex * arc + arc / 2;
      const extraSpins = 6 * 2 * Math.PI;
      
      currentRotation += extraSpins + (1.5 * Math.PI - (currentRotation % (2 * Math.PI))) - targetArcCenter;
      canvas.style.transform = `rotate(${currentRotation}rad)`;

      let clicks = 0;
      const clickInterval = setInterval(() => {
        playClickSound();
        clicks++;
        if (clicks > 25) clearInterval(clickInterval);
      }, 150);

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        gameCard.classList.remove("spinning");
        rabbit.classList.add("win-jump");
        setTimeout(() => rabbit.classList.remove("win-jump"), 600);

        resultBox.innerText = `Ура! Сегодня: ${items[targetIndex].text} ✨`;
        playWinSound();
        spawnConfetti();
      }, 4500);
    }

    function spawnConfetti() {
      const colors = ['#ff7675', '#74b9ff', '#a29bfe', '#fd79a8', '#ffeaa7'];
      for (let i = 0; i < 35; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 3000);
      }
    }

    // Вспомогательные функции для модалок
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    function openQuestions() { document.getElementById("qModal").style.display = "flex"; getRandomQuestion(); }
    function openSketches() { document.getElementById("sketchModal").style.display = "flex"; getRandomSketch(); }

    // ГЕНЕРАТОР НА 500 ВОПРОСОВ
    function generate500Questions() {
      const base = [
        "Какая твоя самая любимая сладость из детства?", "Если бы ты могла выбрать суперспособность, что бы это было?",
        "Какой самый смешной случай произошел с тобой в школе?", "Если бы мы сейчас могли оказаться в любой точке мира на 1 час, куда бы поехали?",
        "Какую песню ты можешь слушать на повторе 10 раз подряд?", "Твой идеальный завтрак — это что?",
        "Какой фильм ты готова пересматривать бесконечно?", "Какая у тебя самая странная или смешная привычка?",
        "Если бы о твоей жизни снимали фильм, какую актрису ты бы выбрала на главную роль?", "Какой лучший подарок тебе когда-либо делали?",
        "Что из еды ты категорически терпеть не можешь?", "Какое твое самое любимое время года и почему?",
        "Если бы тебе дали 1 000 000$ на 1 день с условием всё потратить, что бы ты купила?", "Какое животное больше всего похоже на тебя по характеру?",
        "Твой самый любимый запах в мире?", "Какое умение ты бы хотела освоить за один день?",
        "Если бы ты могла пригласить любого человека на чай, кто бы это был?", "Что тебя мгновенно поднимает настроение?",
        "Какой самый странный сон тебе снился в последнее время?", "Какое твоё самое любимое слово на английском языке?",
        "Что ты первым делом сделаешь, когда мы встретимся в аэропорту?", "Какая твоя самая любимая детская сказка или мультик?",
        "Если бы ты была блюдом, то каким?", "Какую музыку ты обычно слушаешь, когда никто не слышит?",
        "Ты больше любишь рассветы или закаты?", "Какая твоя любимая настольная игра?",
        "Какой цвет у тебя ассоциируется со счастьем?", "Какой самый красивый вид ты видела своими глазами?",
        "Что бы ты выбрала: уметь летать или телепортироваться?", "Какое твоё любимое место для прогулок?"
      ];

      const topics = ["в Великобритании", "на отдыхе", "в выходной день", "осенью", "зимой", "весной", "летом", "в уютном кафе", "на приключениях", "дома под пледом"];
      const prefixes = ["Быстро ответь: ", "Представь себе: ", "Честно скажи: ", "Секретный вопрос: ", "Шуточный вопрос: "];

      let list = [...base];
      let counter = 1;

      while (list.length < 500) {
        const pref = prefixes[counter % prefixes.length];
        const top = topics[counter % topics.length];
        const bQ = base[counter % base.length];
        list.push(`${pref} ${bQ.replace('?', '')} ${top}?`);
        counter++;
      }
      return list;
    }

    const safeQuestions = generate500Questions();

    function getRandomQuestion() {
      document.getElementById("qText").innerText = safeQuestions[Math.floor(Math.random() * safeQuestions.length)];
    }

    const sketches = [
      "Нарисуйте кота в британской королевской короне 👑🐱",
      "Нарисуйте ваш будущий дом мечты в Лондоне 🏡",
      "Нарисуйте друг друга по памяти за 2 минуты без подглядывания! 🎨",
      "Нарисуйте милого инопланетянина, который пьёт английский чай ☕👽",
      "Нарисуйте идеальное свидание на пикнике 🧺",
      "Нарисуйте фантастическую авто-машину будущего 🚗✨",
      "Нарисуйте портрет друг друга одной непрерывной линией!"
    ];
    function getRandomSketch() {
      document.getElementById("sketchText").innerText = sketches[Math.floor(Math.random() * sketches.length)];
    }
  </script>
</body>
</html>
